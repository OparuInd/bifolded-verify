<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tungsten Royce — Project Enquiry</title>
<style>
  :root{ --purple:#3d2a56; --purple2:#5a4178; --ink:#1c1a20; --line:#d9d4e0; --bg:#f7f5fa;
         --ok:#1d7a46; --muted:#8a8194; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  header{background:var(--purple);color:#fff;padding:26px 22px;text-align:center}
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.05em}
  header .sub{opacity:.8;font-size:13px;margin-top:5px}
  main{max-width:560px;margin:26px auto 60px;padding:0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 24px}
  label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--purple);margin:14px 0 5px}
  label .opt{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
  input,textarea,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:14.5px;background:#fff}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--purple2);border-color:var(--purple2)}
  textarea{min-height:96px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  /* honeypot: invisible to people, tempting to bots */
  .hp{position:absolute;left:-6000px;top:-6000px;opacity:0;height:0;overflow:hidden}
  button{width:100%;margin-top:20px;padding:13px;font:inherit;font-size:15px;font-weight:700;border:0;border-radius:8px;cursor:pointer;background:var(--purple);color:#fff}
  button:hover{background:var(--purple2)}
  button:disabled{opacity:.55;cursor:default}
  #err{display:none;border-left:4px solid #a01212;background:#fbf1f1;color:#7a1010;font-size:13.5px;padding:11px 13px;border-radius:7px;margin-top:16px}
  #done{display:none;text-align:center;padding:34px 10px}
  #done .big{font-size:42px}
  #done h2{color:var(--purple);margin:10px 0 6px}
  #done p{color:var(--muted);font-size:14px;line-height:1.55;margin:0}
  #done .ref{margin-top:14px;font-size:13px;color:var(--ink)}
  #done .ref b{color:var(--purple)}
  footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<header>
  <h1>TUNGSTEN ROYCE</h1>
  <div class="sub">Custom bifold doors — tell us about your project</div>
</header>
<main>
  <div class="card">
    <form id="f" novalidate>
      <label>Name</label>
      <input id="name" autocomplete="name" placeholder="Your name">
      <div class="row">
        <div>
          <label>Email <span class="opt">(email or phone — at least one)</span></label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <div>
          <label>Phone</label>
          <input id="phone" type="tel" autocomplete="tel" placeholder="(555) 555-5555">
        </div>
      </div>
      <label>Project location <span class="opt">(city / state)</span></label>
      <input id="site" placeholder="e.g. Denver, CO">
      <label>Tell us about the opening <span class="opt">(rough width × height, garage / patio / storefront, timeline)</span></label>
      <textarea id="details" placeholder="e.g. 16' × 8' garage opening, hoping to install this fall"></textarea>
      <!-- honeypot — leave this empty -->
      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" tabindex="-1" autocomplete="off">
      </div>
      <div id="err"></div>
      <button id="go" type="submit">Send enquiry</button>
    </form>
    <div id="done">
      <div class="big">✓</div>
      <h2>Thank you — we have it.</h2>
      <p>A real person will reach out shortly to set up a rough measure.</p>
      <div class="ref" id="ref"></div>
    </div>
  </div>
  <footer>Tungsten Royce · Bifolded.com · handcrafted bifold doors</footer>
</main>
<script>
const ENDPOINT = "https://cwpvlcajnzxidgtrcpoa.supabase.co/functions/v1/tr-intake";
const APIKEY = "sb_publishable_rfo4gZSOvpieHeb1I8aong_Jeha4eqN"; // publishable — public by design; no office key on this page

document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const err = document.getElementById('err'), go = document.getElementById('go');
  err.style.display = 'none';
  go.disabled = true; go.textContent = 'Sending…';
  try {
    const r = await fetch(ENDPOINT, { method: 'POST',
      headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + APIKEY },
      body: JSON.stringify({
        action: 'enquiry',
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        site: document.getElementById('site').value,
        details: document.getElementById('details').value,
        website: document.getElementById('website').value  // honeypot
      })});
    const j = await r.json().catch(() => ({ ok:false, error:'We could not reach the server — please try again.' }));
    if (!j.ok) {
      err.textContent = j.error || 'Something went wrong — please try again.';
      err.style.display = 'block';
      go.disabled = false; go.textContent = 'Send enquiry';
      return;
    }
    document.getElementById('f').style.display = 'none';
    document.getElementById('ref').innerHTML = (j.label && j.label !== 'received')
      ? 'Your reference: <b>' + j.label + '</b>' : '';
    document.getElementById('done').style.display = 'block';
  } catch (e) {
    err.textContent = 'We could not reach the server — please try again, or email info@bifolded.com.';
    err.style.display = 'block';
    go.disabled = false; go.textContent = 'Send enquiry';
  }
});
</script>
</body>
</html>
