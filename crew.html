<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>TR Crew — My Assignments</title>
<!-- v2.1 — keyed personal links + LOG HOURS / MARK DONE from the phone.
     LEADS (see state.leads in Shop Ops) close a step outright; everyone else's tick is a
     CLAIM that waits in the office queue until Squizz reviews it. The server decides which
     you are from your key — the page only changes the wording. -->
<style>
:root{
  --ink:#1d2125; --ink-soft:#54606b; --line:#e2e6ea;
  --bg:#f4f6f8; --card:#ffffff; --accent:#8b2e2e; --accent-soft:#f3e4e4;
  --ok:#2f855a; --ok-soft:#e6f4ec; --warn:#a96b00; --warn-soft:#f7ead6; --bad:#a33327; --bad-soft:#f8e3e1;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 16px rgba(20,30,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased;padding:18px 14px 96px}
.wrap{max-width:640px;margin:0 auto}
.wordmark{font-weight:700;font-size:12px;letter-spacing:3.5px;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
h1{margin:0 0 2px;font-size:22px;letter-spacing:-.01em}
.sub{margin:0 0 14px;font-size:13px;color:var(--ink-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent)}
.item{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.item:last-child{border-bottom:none}
.top{display:flex;justify-content:space-between;gap:12px}
.nm b{display:block}
.nm small{color:var(--ink-soft)}
.est{flex:none;color:var(--ink-soft);font-size:13px;white-space:nowrap;padding-top:2px}
.entry{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.entry input[type=number]{width:88px;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px}
.entry input[type=text]{flex:1;min-width:140px;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:9px}
.entry label{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.entry input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.item.filled{background:#fbfcfd;border-radius:10px;padding-left:10px;padding-right:10px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--ink-soft);font-size:14px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:var(--radius);padding:14px 16px;font-size:14px}
.cap{font-size:12px;color:var(--ink-soft);margin-top:16px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 16px rgba(20,30,40,.08);display:none}
.bar.on{display:block}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar button{flex:none;font:inherit;font-size:16px;font-weight:700;padding:13px 22px;border:none;border-radius:11px;background:var(--accent);color:#fff}
.bar button:disabled{opacity:.5}
.bar .txt{font-size:13px;color:var(--ink-soft)}
.sent{font-size:13px;color:var(--ink-soft);padding:7px 0;border-bottom:1px solid var(--line)}
.sent:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">Tungsten Royce · BiFolded</div>
  <h1 id="hd">Crew assignments</h1>
  <p class="sub" id="sub">Loading…</p>
  <div id="root"></div>
  <div class="cap" id="cap"></div>
</div>
<div class="bar" id="bar"><div class="in">
  <button id="sendBtn" onclick="send()">Send to office</button>
  <span class="txt" id="barTxt"></span>
</div></div>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbzLZIRUIBacgJtMztKE67WTeJudj77Oqb-zVcUnhTklBO1OdxGHVx8YKpCJgokObySG/exec";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qs=new URLSearchParams(location.search);
const K=(qs.get("k")||"").trim();
let data=null,err="",sentRows=[],sending=false,isLead=false;

function ago(iso){
  if(!iso)return {txt:"never",cls:"bad"};
  const m=(Date.now()-new Date(iso).getTime())/60000;
  const txt=m<2?"just now":m<60?Math.round(m)+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" days ago";
  return {txt,cls:m>5760?"bad":m>1440?"warn":"ok"};
}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ---- what the user has typed but not yet sent ---- */
function collect(){
  const out=[];
  document.querySelectorAll("[data-row]").forEach(el=>{
    const hrs=parseFloat(el.querySelector(".h").value)||0;
    const done=el.querySelector(".d").checked;
    if(!hrs&&!done)return;
    const n=el.querySelector(".n");
    out.push({date:today(),job:el.dataset.job,task:el.dataset.task,
      kind:el.dataset.kind,hrs:hrs,done:done,note:n?n.value.trim():""});
  });
  return out;
}
function dirty(){return collect().length>0}
window.touch=function(el){
  const row=el.closest("[data-row]");
  if(row){const hrs=parseFloat(row.querySelector(".h").value)||0;
    row.classList.toggle("filled",!!(hrs||row.querySelector(".d").checked))}
  const n=collect().length;
  document.getElementById("bar").classList.toggle("on",n>0);
  document.getElementById("barTxt").textContent=n?(n+" line"+(n===1?"":"s")+" ready"):"";
};

function entry(kind,job,task){
  return `<div class="entry" data-row data-kind="${esc(kind)}" data-job="${esc(job)}" data-task="${esc(task)}">
    <input class="h" type="number" step="0.25" min="0" inputmode="decimal" placeholder="hours" oninput="touch(this)">
    <label><input class="d" type="checkbox" oninput="touch(this)"> Finished</label>
    <input class="n" type="text" placeholder="note (optional)">
  </div>`;
}

function render(){
  const root=document.getElementById("root"),sub=document.getElementById("sub"),hd=document.getElementById("hd");
  if(!K){
    hd.textContent="Personal link needed";sub.textContent="";
    root.innerHTML='<div class="err">This page only opens with your personal link from the office. Ask Squizz or Dru to text it to you, then BOOKMARK it — it’s yours alone.</div>';
    return;
  }
  if(err==="bad key"){hd.textContent="Link not active";sub.textContent="";
    root.innerHTML='<div class="err">This link isn’t active — the office may have rotated links. Ask for your new one.</div>';return}
  if(err==="nothing published"){hd.textContent="Crew assignments";sub.textContent="";
    root.innerHTML='<div class="empty">Nothing published yet — check back after the office pushes assignments.</div>';return}
  if(!data||!data.worker){root.innerHTML='<div class="err">Couldn’t reach the shop server. Check signal and pull to refresh — if it keeps failing, tell the office.</div>';sub.textContent="";return}
  const me=data.worker;
  isLead=!!me.lead;
  hd.textContent=me.name;
  const a=ago(data.publishedAt);
  sub.innerHTML=`Your current assignments · <span class="pill ${a.cls}">updated ${a.txt}</span>`
    +(isLead?` <span class="pill ok">lead</span>`:"");
  const sec=(title,rows,rf,emptyTxt)=>`<div class="card"><h2>${title}</h2>${rows.length?rows.map(rf).join(""):`<div class="empty">${emptyTxt}</div>`}</div>`;

  let html=sec("Ready to run — job steps",me.now||[],x=>
    `<div class="item"><div class="top"><span class="nm"><b>${esc(x.nm)}</b><small>${esc(x.job)}</small></span>
      <span class="est">${x.est?("est "+x.est+" hr"):""}</span></div>
      ${entry("Job",x.job,x.nm)}</div>`,"No job steps on your bench right now.");

  html+=sec("Special projects",me.sp||[],x=>
    `<div class="item"><div class="top"><span class="nm"><b>${esc(x.nm)}</b><small>${esc(x.note||"")}</small></span>
      <span class="est">${x.est?("est "+x.est+" hr"):""}${x.due?"<br>due "+esc(x.due)+(x.due<today()?' <span class="pill bad">late</span>':""):""}</span></div>
      ${entry("Special","",x.nm)}</div>`,"None.");

  html+=((me.pre||[]).length?sec("Pre-production duties",me.pre,x=>
    `<div class="item"><div class="top"><span class="nm"><b>${esc(x.duty)}</b><small>${esc(x.job)}</small></span>
      <span class="est">${x.due?"due "+esc(x.due):""}</span></div></div>`,""):"");

  html+=((me.fut||[]).length?sec("Up next — waiting on signed drawing",me.fut,x=>
    `<div class="item"><div class="top"><span class="nm"><b>${esc(x.nm)}</b><small>${esc(x.job)}</small></span>
      <span class="est">${x.est?("est "+x.est+" hr"):""}</span></div></div>`,""):"");

  if(sentRows.length)
    html+=`<div class="card"><h2>Sent to the office</h2>${sentRows.map(r=>
      `<div class="sent">${esc(r.job||r.task)} — ${r.hrs} hr${r.done?" · marked finished":""}
       <span class="pill ${r.applied?"ok":"warn"}">${r.applied?"logged":(r.done&&!isLead?"waiting on review":"with the office")}</span></div>`).join("")}</div>`;

  root.innerHTML=html;
  document.getElementById("cap").innerHTML=`Put your hours against each line and tick <b>Finished</b> when it’s done, then hit Send. `
    +(isLead?`As a lead, your <b>Finished</b> closes the step out.`
            :`Your <b>Finished</b> tells the office it’s complete — they check it and close it out.`)
    +` <a href="#" onclick="load();return false">Refresh</a>`;
  touch(document.body);
}

async function send(){
  if(sending)return;
  const rows=collect();
  if(!rows.length)return;
  sending=true;
  const btn=document.getElementById("sendBtn"),txt=document.getElementById("barTxt");
  btn.disabled=true;txt.textContent="sending…";
  try{
    await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({app:"tr-crewlog",k:K,rows:rows})});
  }catch(e){}
  // confirm by reading back what the server actually holds for us
  let ok=false;
  for(let i=0;i<4&&!ok;i++){
    await new Promise(r=>setTimeout(r,900));
    try{
      const r=await fetch(ENDPOINT+"?fn=crewmine&k="+encodeURIComponent(K),{cache:"no-store"});
      const j=await r.json();
      if(j&&j.rows){sentRows=j.rows;ok=true}
    }catch(e){}
  }
  sending=false;btn.disabled=false;
  if(ok){
    document.querySelectorAll("[data-row]").forEach(el=>{
      el.querySelector(".h").value="";el.querySelector(".d").checked=false;
      const n=el.querySelector(".n");if(n)n.value="";
      el.classList.remove("filled");
    });
    txt.textContent="";
    document.getElementById("bar").classList.remove("on");
    render();
  }else{
    txt.textContent="couldn’t confirm — check signal and hit Send again";
  }
}

async function load(){
  err="";
  if(!K){render();return}
  try{
    const r=await fetch(ENDPOINT+"?fn=assign&k="+encodeURIComponent(K),{cache:"no-store"});
    const j=await r.json();
    if(j&&j.error){err=j.error;data=null}
    else data=j;
  }catch(e){data=null}
  try{
    const r2=await fetch(ENDPOINT+"?fn=crewmine&k="+encodeURIComponent(K),{cache:"no-store"});
    const j2=await r2.json();
    if(j2&&j2.rows)sentRows=j2.rows;
  }catch(e){}
  render();
}
load();
// auto-refresh, but NEVER while there is unsent typing on screen
setInterval(()=>{if(!dirty()&&!sending)load()},5*60*1000);
</script>
</body>
</html>
