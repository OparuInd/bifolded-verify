<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tungsten Royce — Shop Floor</title>
<!--
  TR FINAL SOLUTION — Shop Floor 3.0 (2026-08-15)  ·  PUBLIC (station token)
  The shop tablet, three tabs:
  BOARD — every worker's day: NOW duties w/ big Done ✓ (hours/step/labor ride),
  NEXT queue, photo asks, questions w/ answers, ask strip.
  INVENTORY 3.0 — GROUPS and SUB-GROUPS created right here, each with its
  OWN COLOR border/shadow (color picker inline), collapsible. Items carry
  inventory ID markings, counts (Set = live), requests w/ a dedicated
  🔥 URGENT button, condition buttons (🦷 chipped tooth · 〰 worn edge —
  urgent messages ride to the office), sharpening schedules that flag
  OVERDUE/due-soon and roll forward on "Sharpened ✓", and 📷 send-a-picture
  straight into the office's view.
  MACHINES — issue reporting + the maintenance table w/ due flags.
  Backend: tr-intake v3.1 (migrations 0020–0022). Mounts at verify.bifolded.com/shop.html?k=…
-->
<style>
  :root{ --purple:#3d2a56; --purple2:#5a4178; --gold:#9C7A3E; --ink:#1c1a20;
         --line:#d9d4e0; --bg:#f7f5fa; --muted:#8a8194; --ok:#1d7a46; --warn:#a01212; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  header{background:var(--purple);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.05em}
  header .d{opacity:.85;font-size:14px}
  nav{display:flex;gap:8px;background:var(--purple);padding:0 14px 12px}
  nav button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  nav button.on{background:#fff;color:var(--purple)}
  main{padding:14px;max-width:1400px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .wcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .wname{font-size:19px;font-weight:700;color:var(--purple);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
  .wname .h{font-size:13px;color:var(--muted);font-weight:400}
  .duty{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .duty .j{font-size:13px;color:var(--gold);font-weight:700}
  .duty b{font-size:17px;line-height:1.35}
  .duty .n{font-size:13px;color:var(--muted);margin-top:3px}
  .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  input,select{padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff}
  input.hrs{width:6rem;text-align:right}
  input.qty{width:6.5rem;text-align:right;font-size:17px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:0;padding:13px 20px;font-size:16px;font-weight:700}
  button.go{background:var(--ok);color:#fff}
  button.p{background:var(--purple);color:#fff}
  button.sm{padding:9px 14px;font-size:14px}
  .next{opacity:.66}
  .tag{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .askp{font-size:14px;color:var(--purple);padding:4px 0}
  .q{border-left:4px solid var(--gold);background:#faf8fc;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:14px}
  .q.ans{border-left-color:var(--ok)}
  .q .a{background:#f1ecf7;border-radius:6px;padding:6px 9px;margin-top:5px}
  .q .a b{color:var(--purple)}
  .wait{color:var(--gold);font-weight:700;font-size:12.5px}
  .empty{color:var(--muted);font-size:14px;padding:8px 0}
  .donel{color:var(--ok);font-size:14px;padding:3px 0}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{text-align:left;color:var(--purple);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--line);padding:6px}
  td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .low{color:var(--warn);font-weight:700}
  .chip{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:3px 9px;background:#f1ecf7;color:var(--purple)}
  .chip.due{background:#f5f1e8;color:var(--gold)}
  .chip.over{background:#f9e9e4;color:var(--warn)}
  .chip.ok{background:#e7f3ec;color:var(--ok)}
  .chip.down{background:var(--warn);color:#fff}
  .msgline{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
  .msgline:last-child{border-bottom:0}
  #askbar{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--line);padding:12px 14px;display:none;gap:10px;flex-wrap:wrap;align-items:center}
  #askbar input{flex:1;min-width:220px}
  #gate{text-align:center;padding:60px 20px;color:var(--muted);font-size:16px;line-height:1.6}
  #msg{color:var(--warn);font-size:14px;min-height:18px;padding:4px 14px}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 0 20px}
  h2{color:var(--purple);font-size:16px;margin:18px 0 8px}
  .grp{background:#fff;border:2px solid;border-radius:14px;padding:0;margin-bottom:14px;overflow:hidden}
  .ghead{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;flex-wrap:wrap}
  .ghead b{font-size:18px}
  .ghead .cnt{color:var(--muted);font-size:13px;font-weight:400}
  .dot{width:16px;height:16px;border-radius:50%;flex:none}
  .caret{margin-left:auto;font-size:15px;color:var(--muted)}
  .gbody{padding:2px 16px 12px}
  .sub{border:1.5px solid;border-radius:11px;margin:8px 0;overflow:hidden}
  .sub .ghead{padding:10px 13px}
  .sub .ghead b{font-size:15.5px}
  .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
  .item .nm{font-size:16px;font-weight:700}
  .code{display:inline-block;font-size:11.5px;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted);letter-spacing:.04em}
  .cond{display:inline-block;font-size:11.5px;font-weight:700;border-radius:5px;padding:2px 8px}
  .cond.chipped,.cond.out{background:var(--warn);color:#fff}
  .cond.worn,.cond.sharpen_due{background:#f5f1e8;color:var(--gold)}
  .ibtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .ibtns button{padding:9px 13px;font-size:13.5px;border-radius:9px}
  .ibtns .b1{background:#f1ecf7;color:var(--purple)}
  .ibtns .b2{background:#f9e9e4;color:var(--warn)}
  .ibtns .b3{background:#f5f1e8;color:var(--gold)}
  input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0 2px}
  .addrow input{padding:9px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>TUNGSTEN ROYCE — SHOP FLOOR</h1>
  <div class="d" id="today"></div>
</header>
<nav id="tabs" style="display:none">
  <button id="t_board" class="on" onclick="tab('board')">Board</button>
  <button id="t_inv" onclick="tab('inv')">Inventory</button>
  <button id="t_mach" onclick="tab('mach')">Machines</button>
</nav>
<main>
  <div id="gate">Checking the station link…</div>
  <div id="v_board" style="display:none"><div class="grid" id="board"></div></div>
  <div id="v_inv" style="display:none">
    <div id="invGroups"></div>
    <div class="wcard">
      <div class="row" style="margin-top:0">
        <input id="ngName" placeholder="new group — e.g. Saw Blades" style="min-width:180px">
        <input id="ngColor" type="color" value="#9C7A3E" title="group color">
        <button class="p" onclick="grpAdd()">+ Group</button>
      </div>
      <div class="row">
        <input id="reqName" placeholder="need something not listed?" style="flex:1;min-width:200px">
        <input id="reqQty" class="qty" inputmode="decimal" placeholder="qty">
        <button class="p" onclick="reqFree(false)">Request</button>
        <button class="sm b2" style="background:#f9e9e4;color:var(--warn)" onclick="reqFree(true)">🔥 Urgent</button>
      </div>
    </div>
    <div class="wcard" style="margin-top:14px">
      <h2 style="margin-top:0">Requests &amp; orders</h2>
      <div id="invMsgs"></div>
    </div>
    <input type="file" accept="image/*" capture="environment" id="picFile" style="display:none" onchange="picTaken()">
  </div>
  <div id="v_mach" style="display:none">
    <div class="wcard">
      <h2 style="margin-top:0">Report a machine issue</h2>
      <div class="row">
        <select id="isMach"></select>
        <input id="isWhat" placeholder="what's wrong — be specific" style="flex:1;min-width:220px">
        <select id="isSev"><option value="normal">Can wait</option><option value="urgent">Urgent</option><option value="down">MACHINE DOWN</option></select>
        <button class="p" onclick="reportIssue()">Report</button>
      </div>
      <div id="issues" style="margin-top:10px"></div>
    </div>
    <div class="wcard" style="margin-top:14px">
      <h2 style="margin-top:0">Maintenance</h2>
      <div class="empty">Serviced today rolls the due date forward by the machine's interval.</div>
      <table id="maintT"></table>
    </div>
  </div>
  <div id="msg"></div>
</main>
<div id="askbar">
  <select id="aWho"></select>
  <input id="aQ" placeholder="Ask the office — it lands on their screen and comes back answered here">
  <button class="p" onclick="ask()">Send</button>
</div>
<footer>Tungsten Royce · Shop Floor station · no dollars live here</footer>

<script>
const ENDPOINT="https://cwpvlcajnzxidgtrcpoa.supabase.co/functions/v1/tr-intake";
const APIKEY="sb_publishable_rfo4gZSOvpieHeb1I8aong_Jeha4eqN"; // publishable — public by design
const TOKEN=new URLSearchParams(location.search).get("k")||"";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pub=async(b)=>{try{const r=await fetch(ENDPOINT,{method:"POST",headers:{"content-type":"application/json","Authorization":"Bearer "+APIKEY},body:JSON.stringify(Object.assign({token:TOKEN},b))});return await r.json();}catch(e){return{ok:false,error:"Offline — trying again shortly."};}};
let V=null,S=null,TAB="board";
const jn=id=>id&&V?(V.job_names[id]||""):"";
const who=()=>$("aWho").value||"";

function tab(t){ TAB=t;
  for(const x of ["board","inv","mach"]){ $("v_"+x).style.display=x===t?"block":"none"; $("t_"+x).className=x===t?"on":""; }
  if(t!=="board")loadShop(); else loadBoard();
}

async function loadBoard(){
  const j=await pub({action:"shop_view"});
  if(!j.ok){ $("gate").textContent=j.error; return; }
  V=j;
  $("gate").style.display="none"; $("tabs").style.display="flex"; $("askbar").style.display="flex";
  $("v_board").style.display=TAB==="board"?"block":"none";
  $("today").textContent=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const sel=$("aWho").value;
  $("aWho").innerHTML='<option value="">who is asking?</option>'+j.crew.map(w=>`<option ${w===sel?"selected":""}>${esc(w)}</option>`).join("");
  $("board").innerHTML=j.crew.map(w=>{
    const d=j.duties.filter(x=>x.worker===w);
    const now=d.filter(x=>x.status==="now"), next=d.filter(x=>x.status==="next"), doneT=d.filter(x=>x.status==="done");
    const asks=j.asks.filter(x=>x.worker===w);
    const qs=j.questions.filter(x=>x.worker===w);
    const hrsT=doneT.reduce((s,x)=>s+Number(x.hours||0),0);
    return `<div class="wcard"><div class="wname">${esc(w)}<span class="h">${hrsT?`${Math.round(hrsT*10)/10} h today`:""}</span></div>`+
      (now.length?now.map(x=>`<div class="duty">
          ${x.job_id?`<div class="j">${esc(jn(x.job_id))}</div>`:""}
          <b>${esc(x.title)}</b>${x.note?`<div class="n">${esc(x.note)}</div>`:""}
          <div class="row"><input class="hrs" id="h_${x.id}" inputmode="decimal" placeholder="hrs">
          <button class="go" style="flex:1" onclick="done('${x.id}')">Done ✓</button></div>
        </div>`).join(""):'<div class="empty">Nothing on the board.</div>')+
      next.map(x=>`<div class="duty next"><span class="tag">next</span> ${x.job_id?`<span class="j">${esc(jn(x.job_id))}</span>`:""}
        <b style="font-size:15px">${esc(x.title)}</b></div>`).join("")+
      doneT.map(x=>`<div class="donel">✓ ${esc(x.title)}${x.hours?` · ${x.hours} h`:""}</div>`).join("")+
      asks.map(x=>`<div class="askp">📷 ${esc(x.what)} — <span class="wait">use your phone link</span></div>`).join("")+
      qs.map(q=>`<div class="q ${q.status==="answered"?"ans":""}">${esc(q.question)}
        ${q.status==="answered"?`<div class="a"><b>${esc(q.answered_by||"office")}:</b> ${esc(q.answer)}</div>`
          :'<div class="wait">sent — answer comes back here</div>'}</div>`).join("")+
      `</div>`;
  }).join("")||'<div class="empty">No crew yet — add workers in the Crew Hub.</div>';
}

async function loadShop(){
  const j=await pub({action:"shop_ops_view"});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  S=j;
  renderInv();
  const K={request:"asked",order:"ORDERED",count:"counted",condition:"condition",photo:"📷 picture"};
  $("invMsgs").innerHTML=S.msgs.length?S.msgs.filter(m=>m.kind!=="count").map(m=>`<div class="msgline">
      ${m.urgent?'<span class="chip down">URGENT</span> ':""}
      ${m.from_side==="office"?'<span class="chip ok">office</span>':'<span class="chip">floor</span>'}
      <b>${esc(m.item_name)}</b>${m.qty?` × ${m.qty}`:""} — ${K[m.kind]||m.kind}
      ${m.note?` · ${esc(m.note)}`:""} <span class="tag">${esc(m.by_name||"")}</span>
      ${m.status==="confirmed"?'<span class="chip due">confirmed</span>':m.status==="done"?'<span class="chip ok">done ✓</span>':'<span class="wait">waiting on the office</span>'}
    </div>`).join("")||'<div class="empty">Quiet.</div>':'<div class="empty">Quiet.</div>';
  // machines
  const selM=$("isMach").value;
  $("isMach").innerHTML='<option value="">which machine?</option>'+S.machines.map(m=>`<option value="${m.id}" ${m.id===selM?"selected":""}>${esc(m.name)}</option>`).join("");
  $("issues").innerHTML=S.issues.length?S.issues.map(i=>`<div class="msgline">
      ${i.severity==="down"?'<span class="chip down">DOWN</span>':i.severity==="urgent"?'<span class="chip over">urgent</span>':""}
      <b>${esc(i.machine||"?")}</b> — ${esc(i.what)} <span class="tag">${esc(i.by_name||"")}</span>
      ${i.status==="fixed"?'<span class="chip ok">fixed ✓</span>':i.status==="ack"?'<span class="chip due">office on it</span>':'<span class="wait">reported</span>'}
    </div>`).join(""):'<div class="empty">No open issues — keep it that way.</div>';
  const mn=id=>{const m=S.machines.find(x=>x.id===id);return m?m.name:"?";};
  const today=new Date().toISOString().slice(0,10);
  const soon=new Date(Date.now()+14*86400000).toISOString().slice(0,10);
  $("maintT").innerHTML=(S.maintenance.length?`<tr><th>Machine</th><th>Service</th><th>Last done</th><th>Next due</th><th>Tasked</th><th></th></tr>`:"")+
    S.maintenance.map(m=>{
      const flag=!m.next_due?"":m.next_due<today?`<span class="chip over">OVERDUE</span>`:m.next_due<=soon?`<span class="chip due">due soon</span>`:`<span class="chip ok">ok</span>`;
      return `<tr><td><b>${esc(mn(m.machine_id))}</b></td><td>${esc(m.service)}${m.performed?`<div class="tag">${esc(m.performed)}</div>`:""}</td>
        <td>${m.last_done||"—"}</td><td>${m.next_due||"—"} ${flag}</td><td>${esc(m.tasked_to||"—")}</td>
        <td><button class="sm go" onclick="serviced('${m.id}')">Serviced today ✓</button></td></tr>`;
    }).join("")||'<div class="empty">No service lines yet — the office builds the table in the Crew Hub.</div>';
}

const OPEN={};
const CONDL={good:"",sharpen_due:"sharpen due",chipped:"🦷 chipped",worn:"〰 worn edge",out:"OUT"};
function itemRow(it){
  const low=it.min_qty!=null&&Number(it.qty)<=Number(it.min_qty);
  const today=new Date().toISOString().slice(0,10);
  const soon=new Date(Date.now()+14*86400000).toISOString().slice(0,10);
  const shp=it.sharpen_due?(it.sharpen_due<today?'<span class="chip over">SHARPEN OVERDUE</span>':it.sharpen_due<=soon?`<span class="chip due">sharpen by ${it.sharpen_due}</span>`:`<span class="tag">sharp ok · next ${it.sharpen_due}</span>`):"";
  const sharpish=it.sharpen_interval_days||it.sharpen_due||["chipped","worn","sharpen_due"].includes(it.condition);
  return `<div class="item">
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      <span class="nm">${esc(it.name)}</span>
      ${it.inv_code?`<span class="code">${esc(it.inv_code)}</span>`:""}
      <span class="tag">${esc(it.unit)}</span>
      ${low?'<span class="chip over">LOW</span>':""}
      ${it.condition&&it.condition!=="good"?`<span class="cond ${it.condition}">${CONDL[it.condition]||it.condition}</span>`:""}
      ${shp}
      <span style="margin-left:auto" class="${low?"low":""}"><b style="font-size:18px">${it.qty}</b></span>
      <input class="qty" id="c_${it.id}" inputmode="decimal" placeholder="${it.qty}">
      <button class="sm p" onclick="setCount('${it.id}')">Set</button>
    </div>
    <div class="ibtns">
      <button class="b1" onclick="reqItem('${it.id}',false)">Need more</button>
      <button class="b2" onclick="reqItem('${it.id}',true)">🔥 Urgent</button>
      <button class="b2" onclick="cond('${it.id}','chipped')">🦷 Chipped</button>
      <button class="b3" onclick="cond('${it.id}','worn')">〰 Worn edge</button>
      ${sharpish?`<button class="go sm" onclick="sharpItem('${it.id}')">Sharpened ✓</button>`:""}
      ${it.condition&&it.condition!=="good"?`<button class="sm" onclick="cond('${it.id}','good')">All good ✓</button>`:""}
      <button class="b1" onclick="sendPic('${it.id}')">📷 Picture</button>
    </div></div>`;
}
function grpBlock(g,items,subs,depth){
  const open=OPEN[g.id]!==false;
  const inGrp=items.filter(x=>x.group_id===g.id);
  const n=inGrp.length+subs.reduce((t,sg)=>t+items.filter(x=>x.group_id===sg.id).length,0);
  return `<div class="${depth?"sub":"grp"}" style="border-color:${g.color};${depth?"":`box-shadow:0 3px 16px ${g.color}55`}">
    <div class="ghead" onclick="tog('${g.id}')">
      <span class="dot" style="background:${g.color}"></span><b>${esc(g.name)}</b>
      <span class="cnt">${n} item${n===1?"":"s"}</span>
      <input type="color" value="${g.color}" onclick="event.stopPropagation()" onchange="grpColor('${g.id}',this.value)" title="group color">
      ${depth?"":`<button class="sm" onclick="event.stopPropagation();grpSub('${g.id}')">+ Sub</button>`}
      <button class="sm" onclick="event.stopPropagation();itemAdd('${g.id}')">+ Item</button>
      <span class="caret">${open?"▾":"▸"}</span>
    </div>
    ${open?`<div class="gbody">${inGrp.map(itemRow).join("")||(subs.length?"":'<div class="empty">Empty — add the first item.</div>')}
      ${subs.map(sg=>grpBlock(sg,items,[],1)).join("")}</div>`:""}
  </div>`;
}
function renderInv(){
  const G=S.groups||[];
  const tops=G.filter(g=>!g.parent_id);
  const loose=S.items.filter(x=>!x.group_id||!G.find(g=>g.id===x.group_id));
  $("invGroups").innerHTML=tops.map(g=>grpBlock(g,S.items,G.filter(x=>x.parent_id===g.id),0)).join("")+
    (loose.length?grpBlock({id:"_none",name:"Ungrouped",color:"#8a8194"},loose.map(x=>({...x,group_id:"_none"})),[],0):"")+
    (tops.length||loose.length?"":'<div class="wcard"><div class="empty">No inventory yet — make the first group below.</div></div>');
}
function tog(id){ OPEN[id]=OPEN[id]===false?true:false; renderInv(); }
async function grpAdd(){
  const n=$("ngName").value.trim(); if(n.length<2){ $("msg").textContent="Name the group first."; return; }
  const j=await pub({action:"grp_add",name:n,color:$("ngColor").value,by:who()||undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  $("ngName").value=""; $("msg").textContent=""; loadShop();
}
async function grpSub(pid){
  const n=prompt("Sub-group name:"); if(!n||n.trim().length<2)return;
  const g=(S.groups||[]).find(x=>x.id===pid);
  const j=await pub({action:"grp_add",name:n.trim(),parent_id:pid,color:g?g.color:"#3d2a56",by:who()||undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  loadShop();
}
async function grpColor(id,c){ const j=await pub({action:"grp_set",id,color:c}); if(!j.ok)$("msg").textContent=j.error; else loadShop(); }
async function itemAdd(gid){
  const n=prompt("Item name (e.g. Forrest WW2 12\" blade):"); if(!n||n.trim().length<2)return;
  const code=prompt("Inventory ID marking? (blank = none)")||"";
  const q=prompt("How many on the shelf right now?")||"0";
  const sh=prompt("Sharpening schedule — every how many days? (blank = not a sharpened tool)")||"";
  const j=await pub({action:"item_add",group_id:gid==="_none"?undefined:gid,name:n.trim(),inv_code:code.trim()||undefined,
    qty:parseFloat(q)>=0?parseFloat(q):0,sharpen_interval_days:parseInt(sh)>0?parseInt(sh):undefined,by:who()||undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  loadShop();
}
async function cond(id,c){
  const note=c==="good"?"":prompt(c==="chipped"?"Which tooth / how bad?":"How worn — note for the office:")||"";
  const j=await pub({action:"inv_condition",item_id:id,condition:c,note:note.trim()||undefined,by:who()||undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  $("msg").textContent=""; loadShop();
}
async function sharpItem(id){
  const j=await pub({action:"inv_sharpened",item_id:id,by:who()||undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  $("msg").textContent=""; loadShop();
}
let PIC=null;
function sendPic(id){ PIC=id; $("picFile").click(); }
function picTaken(){
  const f=$("picFile").files[0]; if(!f||!PIC)return;
  const img=new Image();
  img.onload=async function(){
    const M=1600, sc=Math.min(1,M/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    const j=await pub({action:"inv_photo",item_id:PIC,image:cv.toDataURL("image/jpeg",0.82),by:who()||undefined});
    if(!j.ok){ $("msg").textContent=j.error; return; }
    $("picFile").value=""; PIC=null; $("msg").textContent=""; loadShop();
  };
  img.src=URL.createObjectURL(f);
}

async function setCount(id){
  const v=parseFloat($("c_"+id).value);
  if(!Number.isFinite(v)||v<0){ $("msg").textContent="Type the number on the shelf."; return; }
  const j=await pub({action:"inv_count",item_id:id,qty:v,by:who()||undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  $("msg").textContent=""; loadShop();
}
async function reqItem(id,urgent){
  const q=prompt((urgent?"URGENT — ":"")+"How many do you need? (blank = just flag it)");
  if(q===null)return;
  const j=await pub({action:"inv_request",item_id:id,qty:q&&parseFloat(q)>0?parseFloat(q):undefined,urgent:urgent===true,by:who()||undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  $("msg").textContent=""; loadShop();
}
async function reqFree(urgent){
  const n=$("reqName").value.trim(); if(n.length<2){ $("msg").textContent="Name what you need."; return; }
  const q=parseFloat($("reqQty").value);
  const j=await pub({action:"inv_request",name:n,qty:q>0?q:undefined,urgent:urgent===true,by:who()||undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  $("reqName").value=""; $("reqQty").value=""; $("msg").textContent=""; loadShop();
}
async function reportIssue(){
  const m=$("isMach").value, w=$("isWhat").value.trim();
  if(w.length<3){ $("msg").textContent="Say what's wrong."; return; }
  const j=await pub({action:"issue_report",machine_id:m||undefined,machine:m?undefined:"(general)",what:w,severity:$("isSev").value,by:who()||undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  $("isWhat").value=""; $("msg").textContent=""; loadShop();
}
async function serviced(id){
  const p=prompt("What was performed? (blank keeps the line's usual service note)");
  const j=await pub({action:"maint_done",id,performed:p&&p.trim()?p.trim():undefined,by:who()||undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  $("msg").textContent=""; loadShop();
}

async function done(id){
  const hrs=parseFloat($("h_"+id).value)||0;
  const j=await pub({action:"shop_done",duty_id:id,hours:hrs>0?hrs:undefined});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  $("msg").textContent=""; loadBoard();
}
async function ask(){
  const w=$("aWho").value, q=$("aQ").value.trim();
  if(!w){ $("msg").textContent="Pick your name first."; return; }
  if(q.length<3){ $("msg").textContent="Type the question first."; return; }
  const j=await pub({action:"shop_ask",worker:w,question:q});
  if(!j.ok){ $("msg").textContent=j.error; return; }
  $("aQ").value=""; $("msg").textContent=""; loadBoard();
}

if(TOKEN.length<20){ $("gate").textContent="This board opens from the station link — ask the office."; }
else { loadBoard(); }
setInterval(()=>{ if(TAB==="board")loadBoard(); else loadShop(); }, 45000);
</script>
