<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Tungsten Royce — My Assignments</title>
<!-- v1.4 — keyed personal links; server returns only YOUR slice.
     Office staff get a corporate-framed page: no fab sections, task status shown.
     Sending a photo/PDF back is always on for office, and per-person for the shop
     crew (the office ticks 'can send'). Files go to Drive, never into the app. -->
<style>
:root{
  --ink:#1d2125; --ink-soft:#54606b; --line:#e2e6ea;
  --bg:#f4f6f8; --card:#ffffff; --accent:#8b2e2e; --accent-soft:#f3e4e4;
  --ok:#2f855a; --ok-soft:#e6f4ec; --warn:#a96b00; --warn-soft:#f7ead6; --bad:#a33327; --bad-soft:#f8e3e1;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 16px rgba(20,30,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased;padding:18px 14px 60px}
.wrap{max-width:640px;margin:0 auto}
.wordmark{font-weight:700;font-size:12px;letter-spacing:3.5px;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
h1{margin:0 0 2px;font-size:22px;letter-spacing:-.01em}
.sub{margin:0 0 14px;font-size:13px;color:var(--ink-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent)}
.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.item:last-child{border-bottom:none}
.item .nm b{display:block}
.item .nm small{color:var(--ink-soft)}
.item .est{flex:none;color:var(--ink-soft);font-size:13px;white-space:nowrap;padding-top:2px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gray{background:#eceff2;color:var(--ink-soft)}
.item .nm b .pill{margin-right:6px;vertical-align:1px}
.empty{color:var(--ink-soft);font-size:14px}
.namebtn{display:block;width:100%;margin:8px 0;padding:16px;font-size:18px;font-weight:600;font-family:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer}
.namebtn:active{background:var(--accent-soft)}
.stamp{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:var(--ink-soft)}
.stamp button{font-family:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:9px;background:var(--card);cursor:pointer}
.err{background:var(--bad-soft);color:var(--bad);border-radius:var(--radius);padding:14px 16px;font-size:14px}
.cap{font-size:12px;color:var(--ink-soft);margin-top:16px}
.send{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.send label{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;
  border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--card)}
.send input[type=file]{display:none}
.send .st{font-size:12px;color:var(--ink-soft);margin-left:8px}
.send .st.bad{color:var(--bad);font-weight:600} .send .st.ok{color:var(--ok);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark" id="mark">Tungsten Royce · BiFolded</div>
  <h1 id="hd">Assignments</h1>
  <p class="sub" id="sub">Loading…</p>
  <div id="root"></div>
  <div class="cap" id="cap"></div>
</div>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbzLZIRUIBacgJtMztKE67WTeJudj77Oqb-zVcUnhTklBO1OdxGHVx8YKpCJgokObySG/exec?fn=assign";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qs=new URLSearchParams(location.search);
const K=(qs.get("k")||"").trim();
let data=null,err="";

function ago(iso){
  if(!iso)return {txt:"never",cls:"bad"};
  const m=(Date.now()-new Date(iso).getTime())/60000;
  const txt=m<2?"just now":m<60?Math.round(m)+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" days ago";
  return {txt,cls:m>5760?"bad":m>1440?"warn":"ok"};
}
function today(){return new Date().toISOString().slice(0,10)}

function render(){
  const root=document.getElementById("root"),sub=document.getElementById("sub"),hd=document.getElementById("hd");
  if(!K){
    hd.textContent="Personal link needed";
    sub.textContent="";
    root.innerHTML='<div class="err">This page only opens with your personal link from the office. Ask Squizz or Dru to text it to you, then BOOKMARK it — it’s yours alone.</div>';
    return;
  }
  if(err==="bad key"){hd.textContent="Link not active";sub.textContent="";
    root.innerHTML='<div class="err">This link isn’t active — the office may have rotated links. Ask for your new one.</div>';return}
  if(err==="nothing published"){hd.textContent="Assignments";sub.textContent="";
    root.innerHTML='<div class="empty">Nothing published yet — check back after the office pushes assignments.</div>';return}
  if(!data||!data.worker){root.innerHTML='<div class="err">Couldn’t reach the shop server. Check signal and pull to refresh — if it keeps failing, tell the office.</div>';sub.textContent="";return}
  const me=data.worker;
  /* v1.2 — office staff (Chase, Dru) are not fabricators. They get the
     corporate frame and ONLY their task list: no job steps, no pre-production
     duties, no waiting-on-drawing queue. Those sections are meaningless to
     someone who never touches a door, and an empty "nothing on your bench"
     reads like a system that has lost track of them. */
  const OFFICE=!!me.office||qs.get("o")==="1";   // link flag is a fallback if the server drops the field
  hd.textContent=me.name;
  document.getElementById("mark").textContent=OFFICE?"Tungsten Royce · Corporate":"Tungsten Royce · BiFolded";
  document.title=(OFFICE?"Tungsten Royce Corporate":"TR Crew")+" — "+me.name;
  const a=ago(data.publishedAt);
  sub.innerHTML=`Your current ${OFFICE?"tasks":"assignments"} · <span class="pill ${a.cls}">updated ${a.txt}</span>`;
  const sec=(title,rows,rf,emptyTxt)=>`<div class="card"><h2>${title}</h2>${rows.length?rows.map(rf).join(""):`<div class="empty">${emptyTxt}</div>`}</div>`;

  /* A task row carries what it is, how urgent, where it stands, and when it
     is needed — the same four facts the office plate shows, so both sides of
     the conversation are looking at the identical picture. */
  const CANSEND=OFFICE||!!me.canSend;
  const sendBox=(uid,label)=>(CANSEND&&data.upload&&uid)?`<div class="send">
      <label>\ud83d\udcce Send a photo or PDF<input type="file" accept="image/*,application/pdf"
        onchange="sendFile('${esc(uid)}',this,'${esc(String(label||"").replace(/'/g,"\\'"))}')"></label>
      <span class="st" id="st${esc(uid)}"></span></div>`:"";
  const spRow=x=>`<div class="item"><span class="nm"><b>${x.lvln?`<span class="pill ${x.lvl==="now"?"bad":x.lvl==="week"?"warn":"gray"}">${esc(x.lvln)}</span>`:""}${esc(x.nm)}</b>`
    +`${x.stn&&x.st!=="new"?`<span class="pill ${x.st==="done"?"ok":"warn"}">${esc(x.stn)}</span> `:""}`
    +`<small>${esc(x.note||"")}</small>`
    /* v1.3 — send the ANSWER back as a file. It goes straight to the shop's Drive
       folder tagged with this task and your name; the office sees it against the
       task. Nothing is stored on this phone or inside the office app. */
    +sendBox(x.uid,x.nm)
    +`</span>`
    +`<span class="est">${x.est?("est "+x.est+" hr"):""}${x.due?"<br>needed by "+esc(x.due)+(x.due<today()?' <span class="pill bad">late</span>':""):""}</span></div>`;

  root.innerHTML= OFFICE
    ? sec("My tasks",me.sp||[],spRow,"Nothing on your plate right now.")
    : sec("Ready to run — job steps",me.now||[],x=>`<div class="item"><span class="nm"><b>${esc(x.nm)}</b><small>${esc(x.job)}</small>${sendBox(x.uid,x.job+" — "+x.nm)}</span><span class="est">${x.est?("est "+x.est+" hr"):""}</span></div>`,"No job steps on your bench right now.")+
      sec("Special projects",me.sp||[],spRow,"None.")+
      ((me.pre||[]).length?sec("Pre-production duties",me.pre,x=>`<div class="item"><span class="nm"><b>${esc(x.duty)}</b><small>${esc(x.job)}</small></span><span class="est">${x.due?"due "+esc(x.due):""}</span></div>`,""):"")+
      ((me.fut||[]).length?sec("Up next — waiting on signed drawing",me.fut,x=>`<div class="item"><span class="nm"><b>${esc(x.nm)}</b><small>${esc(x.job)}</small></span><span class="est">${x.est?("est "+x.est+" hr"):""}</span></div>`,""):"");

  document.getElementById("cap").innerHTML=(OFFICE
    ? `Status is set by the office as your task moves. Use <b>Send a photo or PDF</b> on a task to get a sample photo or a vendor quote straight to the office — it files itself against that task.`
    : `Log your hours in the crew log as usual — this page is read-only.${CANSEND?" You can send a photo against a step with the \u2039Send a photo or PDF\u203a button.":""}`)
    +` Auto-refreshes every 5 minutes. <a href="#" onclick="load();return false">Refresh now</a>`;
}

const MAX_SEND=12*1024*1024;
window.sendFile=async function(uid,inp,taskName){
  const taskId=uid;
  const f=inp.files&&inp.files[0]; inp.value="";
  const st=document.getElementById("st"+uid); if(!f||!st)return;
  const say=(t,c)=>{st.className="st "+(c||"");st.textContent=t};
  if(f.size>MAX_SEND){say(`That file is ${(f.size/1048576).toFixed(1)} MB — 12 MB is the limit.`,"bad");return}
  say("sending "+(f.size/1048576).toFixed(1)+" MB\u2026");
  const b64=await new Promise((res,rej)=>{const r=new FileReader();
    r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});
  const before=await mineCount();
  try{
    await fetch(data.upload,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({app:"tr-upload",who:data.worker.name,k:K,rot:data.rot||0,
        taskId:taskId,taskName:taskName||"",name:f.name,mime:f.type||"application/octet-stream",data:b64})});
  }catch(e){}
  /* The POST is opaque from this page, so a failure looks exactly like a success.
     Ask the folder whether the file actually arrived before saying it did. */
  await new Promise(r=>setTimeout(r,1500));
  const after=await mineCount();
  if(after>before) say("\u2713 sent to the office","ok");
  else say("Didn\u2019t go through \u2014 check signal and try again.","bad");
};
async function mineCount(){
  try{
    const r=await fetch(data.upload+"?fn=mine&who="+encodeURIComponent(data.worker.name)
      +"&k="+encodeURIComponent(K)+"&rot="+encodeURIComponent(data.rot||0),{cache:"no-store"});
    const j=await r.json(); return (j&&j.ok)?j.count:-1;
  }catch(e){ return -1 }
}
async function load(){
  err="";
  if(!K){render();return}
  try{
    const r=await fetch(ENDPOINT+"&k="+encodeURIComponent(K),{cache:"no-store"});
    const j=await r.json();
    if(j&&j.error){err=j.error;data=null}
    else data=j;
  }catch(e){data=null}
  render();
}
load();
setInterval(load,5*60*1000);
</script>
</body>
</html>
