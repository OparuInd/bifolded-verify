<!-- =====================================================================
     TR INPUT DESK 1.6 (SCANS: the scan database — every scan / photo / document in the cloud, click to view from anywhere; 1.5 part #: quick reference fast0001 + the box's mfg part number, two fields; 1.4 lines: category → item · code fast0001; vendor required for a scan; ⚑ lines not entered; 1.3 receipts: store/vendor list + add vendor, save the scan on its own, fix a saved receipt; 1.2 parts: qty on hand · vendors · order from · ⚑ new vendor; questions in the deck) · 6 Sep 2026 · OFFICE TOOL — NEVER PUBLISH. Carries the office key.
     Dru's desk. Ryan, verbatim: "a functional Input app that presents the data required in a clear and
     concise manner … separated out by category … shows a sample of what he's looking for if it's an
     inventory item. If that sample photo does not exist, then an option to capture a picture, which
     automatically populates to the database, and is linked by date and cost" · "first card of inventory
     or data is highlighted and he can answer 1) the answer 2) Enter later 3) Needs research 4) Request
     Ryan or Chase to assist; … Ryan or Chase is notified and we have a polished entry gateway to answer"
     · "the most High end Visual, streamlined, picture based system for Dru" · "Receipts to Inventory …
     a PHONE AND OR SCAN OCR FUNCTION into inventory for invoices and receipts".

     DECK      the record the book most needs, on top; the next one peeking under it. Category chips
               narrow it. Photo big. Four answers, always the same four places.
     ASSISTS   the gateway: what Dru asked Ryan / Chase, answered here in words or by filling the fields.
     RECEIPTS  a receipt or invoice photo → OCR on this machine (Tesseract) → lines → match to the shelf
               or create → each line lands as an inventory item with the cost, the date and the receipt id.
     Backend: tr-desk v1.0 · migration 0077 · photos in job-files/catalog/<table>/<id>.jpg.
     ===================================================================== -->

<body>
<header><div class="wm">TUNGSTEN <b>ROYCE</b><span style="font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid #5a4a1e;color:#d9a441;border-radius:3px;padding:1px 6px;margin-left:8px;vertical-align:middle">beta</span></div><h1>Input Desk</h1><span class="v">1.6</span>
  <div class="tabs"><button class="on" id="t_deck" onclick="tab('deck')">Deck</button><button id="t_assist" onclick="tab('assist')">Assists<span class="pip" id="asN" style="display:none"></span></button><button id="t_rcpt" onclick="tab('rcpt')">Receipts → inventory</button><button id="t_scans" onclick="tab('scans')">Scans</button></div>
  <div class="r"><button class="go scanbtn" id="scanBtn" onclick="scanPaper()" title="Scan a receipt, invoice or packing slip with the camera">📷 Scan</button><button class="themebtn" onclick="toggleTheme()" title="light / dark">◐</button><button class="themebtn" onclick="signOut()" title="sign out">⏻</button><span id="stat"></span><span id="by" class="mono" style="font-size:12px;color:var(--bronze2)"></span></div></header>
<main>
  <div id="v_deck"><div class="cats" id="cats"></div><div class="deckwrap"><div class="deck" id="deck"></div><div class="side" id="side"></div></div></div>
  <div id="v_assist" style="display:none"></div>
  <div id="v_rcpt" style="display:none"></div>
  <div id="v_scans" style="display:none"></div>
  <div id="lb" class="lb" onclick="if(event.target===this)lbClose()"><div class="lbi"><div class="lbh"><span id="lbCap"></span><span style="margin-left:auto;display:flex;gap:8px"><button class="sm" id="lbRc" onclick="lbOpenRc()">Open receipt</button><a class="sm btn" id="lbNew" target="_blank" rel="noopener">Open in new tab</a><button class="sm" onclick="lbClose()">✕</button></span></div><div class="lbb" id="lbBody"></div></div></div>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="camFile" accept="image/*" capture="environment" style="display:none">
<input type="file" id="rcFile" accept="image/*" style="display:none">
<input type="file" id="scanFile" accept="image/*" capture="environment" style="display:none">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const APIKEY="sb_publishable_rfo4gZSOvpieHeb1I8aong_Jeha4eqN";
/* PUBLISHED TABLET BUILD — no office key in this file. The person is the ?k= office token (workers.kind=office),
   remembered on the device as tr_dk so the installed app opens without the link. tr-desk 1.1 names them from it. */
let TOKEN=""; try{ const u=new URL(location.href); const k=u.searchParams.get("k"); if(k&&k.length>=20){ TOKEN=k; localStorage.setItem("tr_dk",k); history.replaceState(null,"",location.pathname); } else TOKEN=localStorage.getItem("tr_dk")||""; }catch(e){}
const SB_URL="https://cwpvlcajnzxidgtrcpoa.supabase.co", BASE=SB_URL+"/functions/v1/";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let NAME=""; const BY=()=>NAME; let VENDORS=[];
const CREW=BASE+"tr-crew";
/* 0083 — session. The home page signs in (name + password) and leaves {access_token, refresh_token, expires_at} here;
   every call carries it as jwt, refreshed through tr-crew when it is about to expire. ⏻ clears it. */
const SESS_KEY="tr_sess";
function getSess(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||"null"); }catch(e){ return null; } }
async function sessJwt(){ let s=getSess(); if(!s||!s.access_token) return ""; if((s.expires_at||0)*1000<Date.now()+90000){ try{ const r=await fetch(CREW,{method:"POST",headers:{"content-type":"application/json","Authorization":"Bearer "+APIKEY},body:JSON.stringify({action:"refresh",refresh_token:s.refresh_token})}); const j=await r.json(); if(!j.ok){ signOut(); return ""; } s=j.session; localStorage.setItem(SESS_KEY,JSON.stringify(s)); }catch(e){} } return s.access_token; }
function signOut(){ try{ localStorage.removeItem(SESS_KEY); localStorage.removeItem("tr_k"); localStorage.removeItem("tr_station_k"); localStorage.removeItem("tr_dk"); }catch(e){} location.replace("./"); }
const post=async(fn,body)=>{const r=await fetch(BASE+fn,{method:"POST",headers:{"content-type":"application/json","Authorization":"Bearer "+APIKEY},body:JSON.stringify(Object.assign({token:TOKEN,jwt:await sessJwt()},body))});const j=await r.json().catch(()=>({ok:false,error:"HTTP "+r.status}));if(j&&j.error==="signed out"){signOut();}if(!j||!j.ok)throw new Error((j&&j.error)||("HTTP "+r.status));return j;};
const desk=b=>post("tr-desk",b);
const toast=(t,bad)=>{const e=$("toast");e.textContent=t;e.className="toast"+(bad?" bad":"");e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",bad?5000:2600);};
const money=n=>n==null||n===""?"—":"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const LBL={answer:"answer",qty:"qty on hand",photo:"photo",cost:"cost",vendor:"vendor",category:"category",min_qty:"min qty",document:"document",finish:"finish",density:"density",actual_thk:"actual thickness"};
let Q=null,CAT="all",TAB="deck",CUR=null,PHOTO=null,ORDER=[],DONE_N=0;
function tab(t,noload){TAB=t;for(const x of ["deck","assist","rcpt","scans"]){$("v_"+x).style.display=x===t?"block":"none";$("t_"+x).className=x===t?"on":"";} if(noload) return; if(t==="assist")loadAssist(); if(t==="rcpt")loadReceipts(); if(t==="scans")loadScans();}
async function load(){ if(!TOKEN){ location.replace("./"); return; } if(!NAME){ try{ const w=await desk({action:"whoami"}); NAME=w.name; $("by").textContent=NAME; }catch(e){ if(/not valid/i.test(e.message)){ try{localStorage.removeItem("tr_dk")}catch(x){} location.replace("./"); return; } $("deck").innerHTML=`<div class="empty" style="padding:60px">${esc(e.message)}</div>`; return; } } try{ Q=await desk({action:"queue"}); }catch(e){ $("deck").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; } renderCats(); renderDeck(); loadAssistCount(); }
function rows(){ const rs=(Q.rows||[]).filter(r=>CAT==="all"||r.category===CAT); const key=r=>r.table_name+"|"+r.row_id; const idx=new Map(ORDER.map((k,i)=>[k,i])); return rs.slice().sort((a,b)=>(idx.has(key(a))?idx.get(key(a)):1e9)-(idx.has(key(b))?idx.get(key(b)):1e9)); }
function keyOf(r){ return r.table_name+"|"+r.row_id; }
function toBack(){ if(!CUR)return; const k=keyOf(CUR); ORDER=ORDER.filter(x=>x!==k); ORDER.push(k); DONE_N++; }
function syncOrder(){ const rs=(Q.rows||[]).filter(r=>CAT==="all"||r.category===CAT); const have=new Set(ORDER); ORDER=ORDER.filter(k=>rs.some(r=>keyOf(r)===k)); for(const r of rs) if(!have.has(keyOf(r))) ORDER.push(keyOf(r)); }
function flyTop(cls){ return new Promise(res=>{ const t=document.querySelector(".dc.top"); if(!t){res();return;} t.classList.add(cls); setTimeout(res,260); }); }
async function deckNext(){ if(ORDER.length<2)return; await flyTop("fly-r"); ORDER.push(ORDER.shift()); renderDeck(); }
async function deckPrev(){ if(ORDER.length<2)return; await flyTop("fly-d"); ORDER.unshift(ORDER.pop()); renderDeck(); }
async function shuffle(){ const d=$("deck"); d.classList.remove("shuffle"); void d.offsetWidth; d.classList.add("shuffle"); for(let i=ORDER.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ORDER[i],ORDER[j]]=[ORDER[j],ORDER[i]];} setTimeout(renderDeck,220); toast("Shuffled"); }
function wireSwipe(el){
  let x0=0,dx=0,dragging=false; const hl=$("swL"),hr=$("swR");
  el.addEventListener("pointerdown",e=>{ if(e.target.closest("button,input,select,a"))return; x0=e.clientX;dx=0;dragging=true;el.classList.add("swiping");el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove",e=>{ if(!dragging)return; dx=e.clientX-x0; el.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`; el.classList.toggle("wash-l",dx<-40); el.classList.toggle("wash-r",dx>40); if(hl)hl.style.opacity=dx<-40?Math.min(1,(-dx-40)/60):0; if(hr)hr.style.opacity=dx>40?Math.min(1,(dx-40)/60):0; });
  const up=async()=>{ if(!dragging)return; dragging=false; el.classList.remove("swiping"); if(hl)hl.style.opacity=0; if(hr)hr.style.opacity=0;
    if(dx<-110){ el.style.transform="translateX(-130%) rotate(-14deg)"; await later(); }
    else if(dx>110){ el.style.transform="translateX(130%) rotate(14deg)"; setTimeout(()=>deckNext(),60); }
    else { el.style.transform=""; el.classList.remove("wash-l","wash-r"); } };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
}
document.addEventListener("keydown",e=>{
  if(TAB!=="deck"||!CUR)return; const tag=(e.target.tagName||"").toLowerCase(); const typing=tag==="input"||tag==="select"||tag==="textarea";
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); answer(); return; }
  if(typing) return;
  if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); deckNext(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); deckPrev(); }
  else if(e.key==="2"){ later(); } else if(e.key==="3"){ research(); } else if(e.key==="4"){ assist("Ryan"); } else if(e.key.toLowerCase()==="s"){ shuffle(); }
  else if(e.key.toLowerCase()==="p"){ $("camFile").click(); }
  else if(e.key==="1"){ const f=document.querySelector("#side input,#side select"); if(f) f.focus(); }
});
window.deckNext=deckNext;window.deckPrev=deckPrev;window.shuffle=shuffle;
function renderCats(){ const cats=Object.entries(Q.categories).sort((a,b)=>b[1]-a[1]); $("cats").innerHTML=`<span class="${CAT==="all"?"on":""}" onclick="CAT='all';renderCats();renderDeck()">All<b>${Q.rows.length}</b></span>`+cats.map(([c,n])=>`<span class="${CAT===c?"on":""}" onclick="CAT='${esc(c)}';renderCats();renderDeck()">${esc(c)}<b>${n}</b></span>`).join(""); $("stat").textContent=`${Q.rows.length} records need something · ${Q.total} in the book`; }
async function renderDeck(){
  syncOrder(); const rs=rows(); PHOTO=null;
  if(!rs.length){ $("deck").innerHTML='<div class="empty" style="padding:60px">Nothing missing.</div>'; $("side").innerHTML=""; return; }
  CUR=rs[0];
  let photo=CUR.photo_url; if(!photo&&CUR.photo_path){ try{ const c=await desk({action:"card",table:CUR.table_name,id:CUR.row_id}); photo=c.photo_url; CUR.part=c.part; CUR.row=c.row; }catch(e){} }
  else if(!CUR.row){ try{ const c=await desk({action:"card",table:CUR.table_name,id:CUR.row_id}); CUR.part=c.part; CUR.row=c.row; if(!photo)photo=c.photo_url; }catch(e){} }
  const gaps=CUR.missing||[];
  const cardHtml=(r,cls,ph)=>`<div class="dc ${cls}" data-title="${esc(r.title).replace(/"/g,"&quot;")}">${r.table_name==="open_items"?`<div class="photo" style="height:54px;min-height:0;background:linear-gradient(120deg,#3a2f1c,#5a4a1e);display:flex;align-items:center;padding:0 18px;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#d9a441">question · owner ${esc(NAME||"")}</div>`:`<div class="photo">${ph?`<div class="bg" style="background-image:url('${ph}')"></div><img src="${ph}" alt="">`:`<div class="nop"><b>No picture yet</b></div>`}${cls==="top"&&r.table_name!=="open_items"?`<div class="cap"><button class="go sm" onclick="$('camFile').click()">📷 Take / choose photo</button></div>`:""}</div>`}
    <div class="body"><div class="cat">${esc(r.category)} · ${r.table_name==="open_items"?(r.priority==="blocker"?"⛔ blocker":"question")+(r.area?" · "+esc(r.area):""):r.table_name==="inventory_items"?"shelf item":r.table_name==="parts"?"part"+(r.needs_vendor_update?" · ⚑ look for a new vendor":""):r.table_name==="vendor_parts"?"vendor part":"material"}${r.status==="assist"?" · waiting on "+esc(r.assist_to):r.status==="research"?" · flagged for research":r.status==="later"?" · snoozed to "+r.snooze_until:""}</div><div class="ttl">${esc(r.title)}</div>
    ${r.table_name==="open_items"?`<div class="q" style="margin-top:8px;font-size:14.5px;line-height:1.45;white-space:pre-wrap">${esc(r.question||"")}</div>${r.blocks?`<div class="hint" style="margin-top:6px">blocks: ${esc(r.blocks)}</div>`:""}`:""}
    <div class="gaps" ${r.table_name==="open_items"?'style="display:none"':""}>${["qty","photo","cost","vendor","category","document","finish","density","actual_thk","min_qty"].filter(k=>(r.missing||[]).includes(k)||(k==="photo"&&r.photo_path)||(k==="cost"&&r.cost!=null)).map(k=>`<span class="gap ${(r.missing||[]).includes(k)?"":"have"}">${(r.missing||[]).includes(k)?"needs ":"✓ "}${k==="vendor"&&r.table_name==="parts"?"who to order from":LBL[k]||k}</span>`).join("")}</div>
    <div class="kv" ${r.table_name==="open_items"?'style="display:none"':""}><div>code<b>${esc(r.code||"—")}</b></div><div>on hand<b>${r.qty!=null?r.qty+" "+(r.unit||""):"—"}</b></div><div>last ${r.table_name==="parts"?"price":"cost"}<b>${money(r.cost)}${r.cost_at?` <span style="font-size:11px;color:var(--mute)">${r.cost_at}</span>`:""}</b></div>${r.table_name==="parts"&&r.row&&r.row.location?`<div>where<b>${esc(r.row.location)}</b></div>`:""}</div>
    ${r.table_name==="parts"&&r.row&&r.row.vendors?`<table class="vt"><tbody>${r.row.vendors.map(v=>`<tr class="${r.row.preferred_vendor_id===v.vendor_id?"pref":""}"><td>${r.row.preferred_vendor_id===v.vendor_id?"★ ":""}${esc(v.vendor||"—")}</td><td class="mono">${esc(v.code||"")}</td><td>${money(v.unit_cost)}${v.uom?"/"+esc(v.uom):""}</td><td class="mono">${v.quote_date||""}${v.source?" · "+esc(v.source):""}</td></tr>`).join("")}</tbody></table>`:""}
    ${r.assist_answer?`<div class="ans"><b style="font-family:var(--fm);font-size:11px;color:var(--ok)">${esc(r.assist_to)} answered</b><br>${esc(r.assist_answer)}</div>`:""}${r.desk_note&&!r.assist_answer?`<div class="hint" style="margin-top:6px">note: ${esc(r.desk_note)}</div>`:""}</div></div>`;
  $("deck").innerHTML=`<div class="swhint r">skip ›</div><div class="swhint l">later ✓</div>`+[rs[2]?cardHtml(rs[2],"s2",null):"",rs[1]?cardHtml(rs[1],"s1",null):"",cardHtml(CUR,"top",photo)].join("")
    +`<div class="deckbar" style="position:absolute;left:0;right:0;bottom:-38px"><button class="sm ghost" onclick="deckPrev()" title="←">‹</button><span class="mono">${1} of ${rs.length}</span><div class="dots">${rs.slice(0,60).map((_,i)=>`<i class="${i===0?"on":""}"></i>`).join("")}</div><button class="sm ghost" onclick="deckNext()" title="→ / space">skip ›</button><button class="sm ghost" onclick="shuffle()" title="S">⇄ shuffle</button></div>`;
  document.querySelector(".swhint.l").id="swL"; document.querySelector(".swhint.r").id="swR";
  requestAnimationFrame(()=>{const t=document.querySelector(".dc.top"); if(t){ const h=t.offsetHeight; $("deck").style.minHeight=(h+70)+"px"; document.querySelectorAll(".dc.s1,.dc.s2").forEach(c=>c.style.height=h+"px"); wireSwipe(t); }});
  renderSide(gaps);
}
function fieldsFor(){
  const r=CUR, row=r.row||{}, t=r.table_name, need=k=>(r.missing||[]).includes(k)?'<i>needed</i>':"";
  if(t==="parts"){ const vs=row.vendors||[]; return `<div class="f3"><div class="f"><label>On hand${need("qty")}</label><input id="f_qty" inputmode="decimal" value="${row.qty??""}"></div><div class="f"><label>Unit</label><input id="f_unit" value="${esc(row.unit||row.uom||"ea")}"></div><div class="f"><label>Where</label><input id="f_location" value="${esc(row.location||"")}"></div></div>
    <div class="f2"><div class="f"><label>Order from${need("vendor")}</label><select id="f_preferred_vendor_id"><option value="">—</option>${vs.filter((v,i)=>vs.findIndex(x=>x.vendor_id===v.vendor_id)===i).map(v=>`<option value="${v.vendor_id}" ${row.preferred_vendor_id===v.vendor_id?"selected":""}>${esc(v.vendor||"?")} · ${money(v.unit_cost)}</option>`).join("")}</select></div>
    <div class="f"><label>&nbsp;</label><label class="chk" style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--warn);margin:0;padding:9px 0"><input type="checkbox" id="f_look_for_vendor" ${row.look_for_vendor?"checked":""} style="width:auto;margin:0">⚑ look for a new vendor</label></div></div>
    <div class="f"><label>Note</label><input id="f_note" value="${esc(row.note||"")}"></div>`; }
  if(t==="open_items") return `<div class="f"><label>Answer</label><textarea id="f_answer" rows="5" style="width:100%;font:inherit;background:var(--card2);color:var(--fg);border:1px solid var(--line2);border-radius:var(--r);padding:9px 10px" placeholder="">${esc(row.answer||"")}</textarea></div>`;
  const vend=`<select id="f_vendor_id"><option value="">— vendor —</option>${(Q.vendors||[]).map(v=>`<option value="${v.id}" ${row.vendor_id===v.id?"selected":""}>${esc(v.name)}</option>`).join("")}</select>`;
  if(t==="inventory_items") return `<div class="f2"><div class="f"><label>Category${need("category")}</label><select id="f_category">${["","tooling","consumable","hardware","fastener","lumber","sheet","finish","seal","adhesive","other"].map(c=>`<option value="${c}" ${(row.category||"")===c?"selected":""}>${c||"—"}</option>`).join("")}</select></div><div class="f"><label>Inventory ID</label><input id="f_inv_code" value="${esc(row.inv_code||"")}" placeholder="marking on the item"></div></div>
    <div class="f3"><div class="f"><label>Cost each${need("cost")}</label><input id="f_last_cost" inputmode="decimal" value="${row.last_cost??""}" placeholder="0.00"></div><div class="f"><label>As of</label><input id="f_last_cost_at" type="date" value="${row.last_cost_at||Q.today}"></div><div class="f"><label>Source</label><select id="f_last_cost_src"><option value="manual">typed from paper</option><option value="receipt">receipt</option><option value="invoice">vendor invoice</option><option value="research">web research (flags for vendor update)</option></select></div></div>
    <div class="f2"><div class="f"><label>Vendor${need("vendor")}</label>${vend}</div><div class="f"><label>Vendor part code</label><input id="f_vendor_part_code" value="${esc(row.vendor_part_code||"")}" placeholder="their SKU"></div></div>
    <div class="f3"><div class="f"><label>Min qty${need("min_qty")}</label><input id="f_min_qty" inputmode="decimal" value="${row.min_qty??""}"></div><div class="f"><label>Pack qty</label><input id="f_pack_qty" inputmode="decimal" value="${row.pack_qty??""}"></div><div class="f"><label>Unit</label><input id="f_unit" value="${esc(row.unit||"ea")}"></div></div>
    <div class="f"><label>Note</label><input id="f_note" value="${esc(row.note||"")}"></div>`;
  if(t==="vendor_parts") return `<div class="f3"><div class="f"><label>Unit cost${need("cost")}</label><input id="f_unit_cost" inputmode="decimal" value="${row.unit_cost??""}"></div><div class="f"><label>List price</label><input id="f_list_price" inputmode="decimal" value="${row.list_price??""}"></div><div class="f"><label>Source</label><select id="f_cost_source"><option value="quote">quote / ack</option><option value="invoice">invoice</option><option value="website">vendor website</option><option value="research">web research (flags for vendor update)</option></select></div></div>
    <div class="f3"><div class="f"><label>Quote ref</label><input id="f_quote_ref" value="${esc(row.quote_ref||"")}"></div><div class="f"><label>Quote date</label><input id="f_quote_date" type="date" value="${row.quote_date||""}"></div><div class="f"><label>Finish${need("finish")}</label><input id="f_finish" value="${esc(row.finish||"")}"></div></div>
    <div class="f2"><div class="f"><label>Brand</label><input id="f_brand" value="${esc(row.brand||"")}"></div><div class="f"><label>UOM</label><input id="f_uom" value="${esc(row.uom||"")}"></div></div><div class="f"><label>Description</label><input id="f_descr" value="${esc(row.descr||"")}"></div><div class="f"><label>Note</label><input id="f_note" value="${esc(row.note||"")}"></div>
    `;
  return `<div class="f3"><div class="f"><label>Density pcf${need("density")}</label><input id="f_density_pcf" inputmode="decimal" value="${row.density_pcf??""}"></div><div class="f"><label>Nominal thk</label><input id="f_nominal_thk" inputmode="decimal" value="${row.nominal_thk??""}"></div><div class="f"><label>Actual thk${need("actual_thk")}</label><input id="f_actual_thk" inputmode="decimal" value="${row.actual_thk??""}"></div></div>
    <div class="f2"><div class="f"><label>Brand</label><input id="f_brand" value="${esc(row.brand||"")}"></div><div class="f"><label>Kind</label><input id="f_kind" value="${esc(row.kind||"")}"></div></div><div class="f"><label>Source (mill sheet / data sheet)</label><input id="f_source" value="${esc(row.source||"")}"></div><div class="f"><label>Note</label><input id="f_note" value="${esc(row.note||"")}"></div>`;
}
function renderSide(gaps){ /* keyboard: 1 focus · 2 later · 3 research · 4 ask */
  const r=CUR;
  $("side").innerHTML=`<div class="panel"><h2>1 · The answer</h2>${fieldsFor()}<div class="hint" id="photoHint">${PHOTO?"📷 new photo attached — saves with the answer":""}</div><div style="display:flex;gap:8px;margin-top:6px"><button class="go" style="flex:1;padding:12px" onclick="answer()">Save to the record</button></div></div>
    <div class="panel"><h2>Or</h2><div class="four">
      <button class="warn" onclick="later()">2 · Enter later<small>back of the deck for a week</small></button>
      ${r.table_name==="open_items"?`<button disabled style="opacity:.35">3 · Needs research<small>already on the list</small></button>`:`<button onclick="research()">3 · Needs research<small>flag it, it goes on the list</small></button>`}
      <button class="ok" onclick="assist('Ryan')">4 · Ask Ryan<small>his phone + the list</small></button>
      <button class="ok" onclick="assist('Chase')">4 · Ask Chase<small>his phone + the list</small></button></div>
      <div class="f" style="margin-top:10px"><label>Note with it (optional)</label><input id="optNote" placeholder="what you know so far"></div>
      ${r.status==="assist"&&r.assist_answer?`<div style="display:flex;gap:8px"><button class="ok" style="flex:1" onclick="assistClose()">Applied ${esc(r.assist_to)}'s answer ✓</button></div>`:""}
    </div>
    <div class="hint">${rows().length-1} more in ${CAT==="all"?"the deck":CAT}</div>`;
}

async function saveLines(id){
  const lines=[...document.querySelectorAll("#lines tr.l")].map(tr=>({name:tr.querySelector(".ln").value.trim(),qty:+tr.querySelector(".lq").value||1,unit_cost:+String(tr.querySelector(".lc").value).replace(/[^0-9.]/g,""),item_id:tr.querySelector(".li").value||undefined,category:tr.querySelector(".lk").value,part_no:tr.querySelector(".lp").value.trim()||undefined,add_to_stock:tr.querySelector(".ls").checked})).filter(l=>l.name&&l.unit_cost>=0);
  if(!lines.length&&!(id==="new"&&(KIND==="packing_slip"||KIND==="other"))){toast("No lines to save.",true);return;}
  try{
    let rid=id;
    if(id==="new"){ const v0=$("r_vendor").value; if(!v0||v0==="__new"){ toast("⚑ pick the store / vendor",true); $("r_vendor").focus(); return; } // capture the receipt first through the money rail (tr-intake rcpt_add, office)
      const src=document.querySelector("#rcWork img"); const cv=document.createElement("canvas"); const sc=Math.min(1,1600/Math.max(src.naturalWidth,src.naturalHeight)); cv.width=Math.round(src.naturalWidth*sc); cv.height=Math.round(src.naturalHeight*sc); cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height); const dataUrl=cv.toDataURL("image/jpeg",.85);
      const vid=$("r_vendor").value; const j=await desk({action:"receipt_new",kind:KIND,total:+$("r_total").value||lines.reduce((t,l)=>t+l.qty*l.unit_cost,0),store:storeText()||undefined,vendor_id:vid&&vid!=="__new"?vid:undefined,bought_at:$("r_date").value||undefined,image:dataUrl});
      rid=j.id;
    }
    if(!lines.length){ toast("Paper filed."); KIND="receipt"; loadReceipts(); return; }
    const j=await desk({action:"receipt_lines",receipt_id:rid,lines,ocr_text:OCR||undefined});
    KIND="receipt";
    toast(`${j.items.length} line${j.items.length>1?"s":""} on the shelf · ${j.items.filter(i=>i.created).length} new${j.items.filter(i=>i.created&&i.code).length?" · "+j.items.filter(i=>i.created&&i.code).map(i=>i.code).join(" "):""}`); loadReceipts();
  }catch(e){toast(e.message,true);}
}

load();
</script>
