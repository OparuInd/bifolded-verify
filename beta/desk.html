<!-- =====================================================================
     TR INPUT DESK 1.8 (SURVEYS tab — every laser survey in the cloud with its drawing; 1.7 Agreement ↗ link — the web Agreement 2.0; 1.6 SCANS: the scan database — every scan / photo / document in the cloud, click to view from anywhere; 1.5 part #: quick reference fast0001 + the box's mfg part number, two fields; 1.4 lines: category → item · code fast0001; vendor required for a scan; ⚑ lines not entered; 1.3 receipts: store/vendor list + add vendor, save the scan on its own, fix a saved receipt; 1.2 parts: qty on hand · vendors · order from · ⚑ new vendor; questions in the deck) · 6 Sep 2026 · OFFICE TOOL — NEVER PUBLISH. Carries the office key.
     Dru's desk. Ryan, verbatim: "a functional Input app that presents the data required in a clear and
     concise manner … separated out by category … shows a sample of what he's looking for if it's an
     inventory item. If that sample photo does not exist, then an option to capture a picture, which
     automatically populates to the database, and is linked by date and cost" · "first card of inventory
     or data is highlighted and he can answer 1) the answer 2) Enter later 3) Needs research 4) Request
     Ryan or Chase to assist; … Ryan or Chase is notified and we have a polished entry gateway to answer"
     · "the most High end Visual, streamlined, picture based system for Dru" · "Receipts to Inventory …
     a PHONE AND OR SCAN OCR FUNCTION into inventory for invoices and receipts".

     DECK      the record the book most needs, on top; the next one peeking under it. Category chips
               narrow it. Photo big. Four answers, always the same four places.
     ASSISTS   the gateway: what Dru asked Ryan / Chase, answered here in words or by filling the fields.
     RECEIPTS  a receipt or invoice photo → OCR on this machine (Tesseract) → lines → match to the shelf
               or create → each line lands as an inventory item with the cost, the date and the receipt id.
     Backend: tr-desk v1.0 · migration 0077 · photos in job-files/catalog/<table>/<id>.jpg.
     ===================================================================== -->

<script>
const APIKEY="sb_publishable_rfo4gZSOvpieHeb1I8aong_Jeha4eqN";
/* PUBLISHED TABLET BUILD — no office key in this file. The person is the ?k= office token (workers.kind=office),
   remembered on the device as tr_dk so the installed app opens without the link. tr-desk 1.1 names them from it. */
const HASH0=location.hash; let TOKEN=""; try{ const u=new URL(location.href); const k=u.searchParams.get("k"); if(k&&k.length>=20){ TOKEN=k; localStorage.setItem("tr_dk",k); history.replaceState(null,"",location.pathname); } else TOKEN=localStorage.getItem("tr_dk")||""; }catch(e){}
const SB_URL="https://cwpvlcajnzxidgtrcpoa.supabase.co", BASE=SB_URL+"/functions/v1/";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let NAME=""; const BY=()=>NAME; let VENDORS=[]; let PEOPLE={office:[],shop:[],crew:[]};   // 2.9: who to ask / who to assign is DATA (workers), never a constant
const CREW=BASE+"tr-crew";
/* 0083 — session. The home page signs in (name + password) and leaves {access_token, refresh_token, expires_at} here;
   every call carries it as jwt, refreshed through tr-crew when it is about to expire. ⏻ clears it. */
const SESS_KEY="tr_sess";
function getSess(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||"null"); }catch(e){ return null; } }
async function sessJwt(){ let s=getSess(); if(!s||!s.access_token) return ""; if((s.expires_at||0)*1000<Date.now()+90000){ try{ const r=await fetch(CREW,{method:"POST",headers:{"content-type":"application/json","Authorization":"Bearer "+APIKEY},body:JSON.stringify({action:"refresh",refresh_token:s.refresh_token})}); const j=await r.json(); if(!j.ok){ signOut(); return ""; } s=j.session; localStorage.setItem(SESS_KEY,JSON.stringify(s)); }catch(e){} } return s.access_token; }
function signOut(){ try{ localStorage.removeItem(SESS_KEY); localStorage.removeItem("tr_k"); localStorage.removeItem("tr_station_k"); localStorage.removeItem("tr_dk"); }catch(e){} location.replace("./"); }
const post=async(fn,body)=>{const r=await fetch(BASE+fn,{method:"POST",headers:{"content-type":"application/json","Authorization":"Bearer "+APIKEY},body:JSON.stringify(Object.assign({token:TOKEN,jwt:await sessJwt()},body))});const j=await r.json().catch(()=>({ok:false,error:"HTTP "+r.status}));if(j&&j.error==="signed out"){signOut();}if(!j||!j.ok)throw new Error((j&&j.error)||("HTTP "+r.status));return j;};
const desk=b=>post("tr-desk",b);
const toast=(t,bad)=>{const e=$("toast");e.textContent=t;e.className="toast"+(bad?" bad":"");e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",bad?5000:2600);};
const money=n=>n==null||n===""?"—":"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const LBL={answer:"answer",qty:"qty on hand",photo:"photo",cost:"cost",vendor:"vendor",category:"category",min_qty:"min qty",document:"document",finish:"finish",density:"density",actual_thk:"actual thickness"};
let Q=null,CAT="all",TAB="deck",CUR=null,PHOTO=null,ORDER=[],DONE_N=0;
function tab(t,noload){TAB=t;for(const x of ["deck","assist","rcpt","shelf","parts","vend","cust","pd","open","scans","surveys","rcvd","steel","job"]){$("v_"+x).style.display=x===t?"block":"none";$("t_"+x).className=x===t?"on":"";} if(noload) return; if(t==="assist")loadAssist(); if(t==="rcpt")loadReceipts(); if(t==="shelf")loadShelf(); if(t==="parts")loadParts(); if(t==="vend")loadVend(); if(t==="cust")loadCust(); if(t==="pd")loadPd(); if(t==="open")loadOpen(); if(t==="scans")loadScans(); if(t==="surveys")loadSurveys(); if(t==="rcvd")loadRcvd(); if(t==="steel")loadSteel(); if(t==="job")loadJob();}
async function load(){ if(!TOKEN){ location.replace("./"); return; } if(!NAME){ try{ const w=await desk({action:"whoami"}); NAME=w.name; $("by").textContent=NAME; }catch(e){ if(/not valid/i.test(e.message)){ try{localStorage.removeItem("tr_dk")}catch(x){} location.replace("./"); return; } $("deck").innerHTML=`<div class="empty" style="padding:60px">${esc(e.message)}</div>`; return; } } try{ Q=await desk({action:"queue"}); }catch(e){ $("deck").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; } if(!VENDORS.length&&Q.vendors) VENDORS=Q.vendors.slice(); renderCats(); renderDeck(); loadAssistCount(); pollRcvd(); pushHint(); loadPeople(); loadCats(); }
async function loadCats(){ try{ const j=await desk({action:"items"}); if(j.categories&&j.categories.length) CATS=j.categories; if(CUR&&TAB==="deck") renderSide(); }catch(e){} }
async function loadPeople(){ try{ const j=await desk({action:"people"}); PEOPLE={office:j.office||[],shop:j.shop||[],crew:j.crew||[]}; if(CUR&&TAB==="deck") renderSide(); }catch(e){ toast("who to ask: "+e.message,true); } }
function askList(){ return (PEOPLE.office||[]).map(n=>({n,s:"their phone + the list"})).concat((PEOPLE.shop||[]).map(n=>({n,s:"the shop tablet + the list"}))); }
function askBtns(a,b){ return askList().slice(a,b).map((p,i)=>`<button class="ok" onclick="assist('${esc(p.n)}')">${a===0&&i===0?"4 \u00b7 ":""}Ask ${esc(p.n)}<small>${p.s}</small></button>`).join(""); }
function rows(){ const rs=(Q.rows||[]).filter(r=>CAT==="all"||r.category===CAT); const key=r=>r.table_name+"|"+r.row_id; const idx=new Map(ORDER.map((k,i)=>[k,i])); return rs.slice().sort((a,b)=>(idx.has(key(a))?idx.get(key(a)):1e9)-(idx.has(key(b))?idx.get(key(b)):1e9)); }
function keyOf(r){ return r.table_name+"|"+r.row_id; }
function toBack(){ if(!CUR)return; const k=keyOf(CUR); ORDER=ORDER.filter(x=>x!==k); ORDER.push(k); DONE_N++; }
function syncOrder(){ const rs=(Q.rows||[]).filter(r=>CAT==="all"||r.category===CAT); const have=new Set(ORDER); ORDER=ORDER.filter(k=>rs.some(r=>keyOf(r)===k)); for(const r of rs) if(!have.has(keyOf(r))) ORDER.push(keyOf(r)); }
function flyTop(cls){ return new Promise(res=>{ const t=document.querySelector(".dc.top"); if(!t){res();return;} t.classList.add(cls); setTimeout(res,260); }); }
async function deckNext(){ if(ORDER.length<2)return; await flyTop("fly-r"); ORDER.push(ORDER.shift()); renderDeck(); }
async function deckPrev(){ if(ORDER.length<2)return; await flyTop("fly-d"); ORDER.unshift(ORDER.pop()); renderDeck(); }
async function shuffle(){ const d=$("deck"); d.classList.remove("shuffle"); void d.offsetWidth; d.classList.add("shuffle"); for(let i=ORDER.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ORDER[i],ORDER[j]]=[ORDER[j],ORDER[i]];} setTimeout(renderDeck,220); toast("Shuffled"); }
function wireSwipe(el){
  let x0=0,dx=0,dragging=false; const hl=$("swL"),hr=$("swR");
  el.addEventListener("pointerdown",e=>{ if(e.target.closest("button,input,select,a"))return; x0=e.clientX;dx=0;dragging=true;el.classList.add("swiping");el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove",e=>{ if(!dragging)return; dx=e.clientX-x0; el.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`; el.classList.toggle("wash-l",dx<-40); el.classList.toggle("wash-r",dx>40); if(hl)hl.style.opacity=dx<-40?Math.min(1,(-dx-40)/60):0; if(hr)hr.style.opacity=dx>40?Math.min(1,(dx-40)/60):0; });
  const up=async()=>{ if(!dragging)return; dragging=false; el.classList.remove("swiping"); if(hl)hl.style.opacity=0; if(hr)hr.style.opacity=0;
    if(dx<-110){ el.style.transform="translateX(-130%) rotate(-14deg)"; await later(); }
    else if(dx>110){ el.style.transform="translateX(130%) rotate(14deg)"; setTimeout(()=>deckNext(),60); }
    else { el.style.transform=""; el.classList.remove("wash-l","wash-r"); } };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
}
document.addEventListener("keydown",e=>{
  if(TAB!=="deck"||!CUR)return; const tag=(e.target.tagName||"").toLowerCase(); const typing=tag==="input"||tag==="select"||tag==="textarea";
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); answer(); return; }
  if(typing) return;
  if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); deckNext(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); deckPrev(); }
  else if(e.key==="2"){ later(); } else if(e.key==="3"){ research(); } else if(e.key==="4"){ const a=askList()[0]; if(a) assist(a.n); } else if(e.key.toLowerCase()==="s"){ shuffle(); }
  else if(e.key.toLowerCase()==="p"){ $("camFile").click(); }
  else if(e.key==="1"){ const f=document.querySelector("#side input,#side select"); if(f) f.focus(); }
});
window.deckNext=deckNext;window.deckPrev=deckPrev;window.shuffle=shuffle;
function renderCats(){ const cats=Object.entries(Q.categories).sort((a,b)=>b[1]-a[1]); $("cats").innerHTML=`<span class="${CAT==="all"?"on":""}" onclick="CAT='all';renderCats();renderDeck()">All<b>${Q.rows.length}</b></span>`+cats.map(([c,n])=>`<span class="${CAT===c?"on":""}" onclick="CAT='${esc(c)}';renderCats();renderDeck()">${esc(c)}<b>${n}</b></span>`).join(""); $("stat").textContent=`${Q.rows.length} records need something · ${Q.total} in the book`; }
async function renderDeck(){
  syncOrder(); const rs=rows(); PHOTO=null;
  if(!rs.length){ $("deck").innerHTML='<div class="empty" style="padding:60px">Nothing missing.</div>'; $("side").innerHTML=""; return; }
  CUR=rs[0];
  let photo=CUR.photo_url; if(!photo&&CUR.photo_path){ try{ const c=await desk({action:"card",table:CUR.table_name,id:CUR.row_id}); photo=c.photo_url; CUR.part=c.part; CUR.row=c.row; }catch(e){} }
  else if(!CUR.row){ try{ const c=await desk({action:"card",table:CUR.table_name,id:CUR.row_id}); CUR.part=c.part; CUR.row=c.row; if(!photo)photo=c.photo_url; }catch(e){} }
  const gaps=CUR.missing||[];
  const cardHtml=(r,cls,ph)=>`<div class="dc ${cls}" data-title="${esc(r.title).replace(/"/g,"&quot;")}">${r.table_name==="open_items"?`<div class="photo" style="height:54px;min-height:0;background:linear-gradient(120deg,#3a2f1c,#5a4a1e);display:flex;align-items:center;padding:0 18px;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#d9a441">question · owner ${esc(NAME||"")}</div>`:`<div class="photo">${ph?`<div class="bg" style="background-image:url('${ph}')"></div><img src="${ph}" alt="">`:`<div class="nop"><b>No picture yet</b></div>`}${cls==="top"&&r.table_name!=="open_items"?`<div class="cap"><button class="go sm" onclick="$('camFile').click()">📷 Take / choose photo</button></div>`:""}</div>`}
    <div class="body"><div class="cat">${esc(r.category)} · ${r.table_name==="open_items"?(r.priority==="blocker"?"⛔ blocker":"question")+(r.area?" · "+esc(r.area):""):r.table_name==="inventory_items"?"shelf item":r.table_name==="parts"?"part"+(r.needs_vendor_update?" · ⚑ look for a new vendor":""):r.table_name==="vendor_parts"?"vendor part":"material"}${r.status==="assist"?" · waiting on "+esc(r.assist_to):r.status==="research"?" · flagged for research":r.status==="later"?" · snoozed to "+r.snooze_until:""}</div><div class="ttl">${esc(r.title)}</div>
    ${r.table_name==="open_items"?`<div class="q" style="margin-top:8px;font-size:14.5px;line-height:1.45;white-space:pre-wrap">${esc(r.question||"")}</div>${r.blocks?`<div class="hint" style="margin-top:6px">blocks: ${esc(r.blocks)}</div>`:""}`:""}
    <div class="gaps" ${r.table_name==="open_items"?'style="display:none"':""}>${["qty","photo","cost","vendor","category","document","finish","density","actual_thk","min_qty"].filter(k=>(r.missing||[]).includes(k)||(k==="photo"&&r.photo_path)||(k==="cost"&&r.cost!=null)).map(k=>`<span class="gap ${(r.missing||[]).includes(k)?"":"have"}">${(r.missing||[]).includes(k)?"needs ":"✓ "}${k==="vendor"&&r.table_name==="parts"?"who to order from":LBL[k]||k}</span>`).join("")}</div>
    <div class="kv" ${r.table_name==="open_items"?'style="display:none"':""}><div>code<b>${esc(r.code||"—")}</b></div><div>on hand<b>${r.qty!=null?r.qty+" "+(r.unit||""):"—"}</b></div><div>last ${r.table_name==="parts"?"price":"cost"}<b>${money(r.cost)}${r.cost_at?` <span style="font-size:11px;color:var(--mute)">${r.cost_at}</span>`:""}</b></div>${r.table_name==="parts"&&r.row&&r.row.location?`<div>where<b>${esc(r.row.location)}</b></div>`:""}</div>

  $("v_surveys").innerHTML=`<div class="rc"><div><div class="list">${SV.map(x=>`<div class="rr ${x.id===SVSEL?"on":""}" onclick="SVSEL='${x.id}';renderSurveys()"><div><b>${fmtInch(x.w)} × ${fmtInch(x.h)}</b> · ${esc(x.site||"—")}${x.opening?" · "+esc(x.opening):""}<div class="m">${esc(x.date||String(x.at||"").slice(0,10))} · ${esc(x.by_name||"")} · ${esc(x.source||"")}</div></div></div>`).join("")||'<div class="empty">No surveys yet.</div>'}</div></div><div>${v?surveySvg(v,{dark:document.documentElement.dataset.theme!=="light"}):'<div class="empty">Pick a survey.</div>'}${v?`<div class="m" style="margin-top:8px;font-size:12px;color:var(--mute)">${esc(v.site||"")}${v.opening?" · "+esc(v.opening):""} · ${esc(v.date||"")} · ${esc(v.by_name||"")} · ${v.n_w+v.n_h} readings${v.quote_id?" · on a quote":""}${v.job_id?" · on a job":""}</div>`:""}</div></div>`; }
function fmtInch(n){ n=Number(n)||0; const ft=Math.floor(n/12), r=Math.round((n-ft*12)*16)/16; const wh=Math.floor(r), f=r-wh; const F={0:"",0.125:"1/8",0.25:"1/4",0.375:"3/8",0.5:"1/2",0.625:"5/8",0.75:"3/4",0.875:"7/8",0.0625:"1/16",0.1875:"3/16",0.3125:"5/16",0.4375:"7/16",0.5625:"9/16",0.6875:"11/16",0.8125:"13/16",0.9375:"15/16"}[Math.round(f*10000)/10000]||""; return (ft?ft+"′ ":"")+(wh||!F?wh:"")+(F?(wh?"-":"")+F:"")+"″"; }
/* surveySvg(v) — one drawing of a laser survey. Used by laser.html, desk.html (Surveys), agree.html (picker).
   v = a surveys row (w, h, w_min.., raw{widthReadings[{pos,total}], heightReadings[..], clearances{top,left,right}}) */
function surveySvg(v, opt){
  opt=opt||{}; const W=Number(v.w)||0, H=Number(v.h)||0; if(!W||!H) return '<div style="padding:20px;color:#8f8a82">no opening</div>';
  const raw=v.raw||{}; const wr=(raw.widthReadings||[]).map(x=>({pos:String(x.pos||""),t:Number(x.total)||0})).filter(x=>x.t>0);
  const hr=(raw.heightReadings||[]).map(x=>({pos:String(x.pos||""),t:Number(x.total)||0})).filter(x=>x.t>0);
  const wmin=Number(v.w_min??(wr.length?Math.min(...wr.map(x=>x.t)):W)), wmax=Number(v.w_max??(wr.length?Math.max(...wr.map(x=>x.t)):W));
  const hmin=Number(v.h_min??(hr.length?Math.min(...hr.map(x=>x.t)):H)), hmax=Number(v.h_max??(hr.length?Math.max(...hr.map(x=>x.t)):H));
  const cl=v.clearances||raw.clearances||{}; const ct=Number(cl.top||0), cL=Number(cl.left||0), cR=Number(cl.right||0);
  const fi=n=>{ n=Number(n)||0; const ft=Math.floor(n/12), r=n-ft*12; const fr=Math.round(r*16)/16; const wh=Math.floor(fr), f=fr-wh; const F={0:"",0.0625:"1/16",0.125:"1/8",0.1875:"3/16",0.25:"1/4",0.3125:"5/16",0.375:"3/8",0.4375:"7/16",0.5:"1/2",0.5625:"9/16",0.625:"5/8",0.6875:"11/16",0.75:"3/4",0.8125:"13/16",0.875:"7/8",0.9375:"15/16"}[Math.round(f*10000)/10000]||""; return (ft?ft+"′ ":"")+(wh||!F?wh:"")+(F?(wh?"-":"")+F:"")+"″"; };
  const dark=opt.dark!==false; const ink=dark?"#f4f2ee":"#1c1a20", mute=dark?"#8f8a82":"#6b6558", bronze="#c9ab7f", line=dark?"#3a3a3a":"#cfc8ba", bg=dark?"#141414":"#fbf9f6", warn="#d9a441";
  const inner=dark?"#1f1f1f":"#fff";
  const pw=560, ph=Math.round(pw*Math.min(1.15,Math.max(0.45,H/W))+110); const pad=78; const iw=pw-pad*2, ih=ph-pad-60; const sx=iw/wmax, sy=ih/hmax;
  const cx=pad+iw/2, top=48;
  // true opening (max readings) faint, governing (min) solid
  const gx=cx-(W*sx)/2, gy=top+(hmax-H)*sy;   // governing sits on the floor
  const tx=cx-(wmax*sx)/2;
  // A value sits in its own gap in its line, in a box no line can cross. The line says which reading it is
  // (bottom / mid / top, left / centre / right), so the box carries the number alone. Anything that cannot
  // be placed clear of another value drops to a row under the opening with its position spelled out.
  const FS=11, CHW=FS*0.62, BH=FS+7;
  const tw=t=>t.length*CHW+10;
  const box=(x,y,t,col,rot)=>{ const w=tw(t), g=rot?` transform="rotate(-90 ${x.toFixed(1)} ${y.toFixed(1)})"`:"";
    return `<g${g}><rect x="${(x-w/2).toFixed(1)}" y="${(y-BH/2).toFixed(1)}" width="${w.toFixed(1)}" height="${BH}" rx="2" fill="${inner}" stroke="${col}" stroke-opacity=".45"/>`
         + `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${FS}" fill="${col}">${t}</text></g>`; };
  const seg=(x1,y1,x2,y2,col,w)=>(Math.abs(x2-x1)+Math.abs(y2-y1)>3?`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${w}"/>`:"");
  let s=`<svg viewBox="0 0 ${pw} ${ph}" width="100%" style="max-width:${pw}px;display:block;background:${bg};border-radius:4px;font-family:JetBrains Mono,ui-monospace,Menlo,monospace">`;
  s+=`<rect x="${tx}" y="${top}" width="${wmax*sx}" height="${hmax*sy}" fill="none" stroke="${line}" stroke-dasharray="5 4"/>`;
  s+=`<rect x="${gx}" y="${gy}" width="${W*sx}" height="${H*sy}" fill="${inner}" stroke="${bronze}" stroke-width="2"/>`;
  if(ct||cL||cR){ s+=`<rect x="${gx+cL*sx}" y="${gy+ct*sy}" width="${(W-cL-cR)*sx}" height="${(H-ct)*sy}" fill="none" stroke="${warn}" stroke-width="1" stroke-dasharray="3 3"/>`; }
  const placed=[], out=[];
  const clash=(a,b)=>!(a.x2<=b.x1||b.x2<=a.x1||a.y2<=b.y1||b.y2<=a.y1);
  const fits=(x,y,w,h)=>{ const r={x1:x-w/2-3,y1:y-h/2-3,x2:x+w/2+3,y2:y+h/2+3};
    if(r.x1<gx+2||r.x2>gx+W*sx-2||r.y1<gy+2||r.y2>gy+H*sy-2) return null;
    return placed.some(p=>clash(r,p))?null:r; };
  let ln="", lb="";
  // width readings across (bottom / mid / top)
  const rowY={Bottom:gy+H*sy-15,Mid:gy+H*sy/2,Top:gy+15};
  for(const r of wr){
    const y=rowY[r.pos]??gy+H*sy/2, gov=Math.abs(r.t-wmin)<1e-6, col=gov?bronze:mute, lw=gov?1.5:0.8;
    const t=`${fi(r.t)}${gov?" \u25c2":""}`, w=tw(t), hit=fits(cx,y,w,BH);
    if(hit){ placed.push(hit); ln+=seg(gx+6,y,cx-w/2-5,y,col,lw)+seg(cx+w/2+5,y,gx+W*sx-6,y,col,lw); lb+=box(cx,y,t,col,false); }
    else { ln+=seg(gx+6,y,gx+W*sx-6,y,col,lw); out.push({t:`${r.pos.toLowerCase()} ${t}`,col}); }
  }
  // height readings down (left / centre / right)
  const colX={Left:gx+15,Centre:cx,Center:cx,Right:gx+W*sx-15};
  for(const r of hr){
    const x=colX[r.pos]??cx, my=gy+H*sy/2, gov=Math.abs(r.t-hmin)<1e-6, col=gov?bronze:mute, lw=gov?1.5:0.8;
    const t=`${fi(r.t)}${gov?" \u25c2":""}`, w=tw(t), hit=fits(x,my,BH,w);
    if(hit){ placed.push(hit); ln+=seg(x,gy+6,x,my-w/2-5,col,lw)+seg(x,my+w/2+5,x,gy+H*sy-6,col,lw); lb+=box(x,my,t,col,true); }
    else { ln+=seg(x,gy+6,x,gy+H*sy-6,col,lw); out.push({t:`${r.pos.toLowerCase()} ${t}`,col}); }
  }
  s+=ln+lb;
  // whatever would not sit clear goes under the opening, spelled out
  if(out.length){ const gap=10, tot=out.reduce((a,o)=>a+tw(o.t),0)+gap*(out.length-1);
    let x=cx-tot/2, y=gy+H*sy+15;
    for(const o of out){ const w=tw(o.t); s+=box(x+w/2,y,o.t,o.col,false); x+=w+gap; } }
  // dimensions
  s+=`<text x="${cx}" y="${top-16}" text-anchor="middle" font-size="13" fill="${ink}" font-weight="600">${fi(W)} × ${fi(H)}</text>`;
  s+=`<text x="${cx}" y="${top-2}" text-anchor="middle" font-size="10" fill="${mute}">governing · smallest reading each way</text>`;
  const spW=wmax-wmin, spH=hmax-hmin; const sq=Math.max(spW,spH); const call=sq<0.125?"square within an eighth":sq<0.375?"slightly out of square":sq<0.75?"out of square":"well out of square";
  s+=`<text x="${cx}" y="${ph-34}" text-anchor="middle" font-size="11" fill="${sq>=0.375?warn:mute}">${call} · width varies ${spW.toFixed(3)}″ · height ${spH.toFixed(3)}″</text>`;
  if(ct||cL||cR) s+=`<text x="${cx}" y="${ph-18}" text-anchor="middle" font-size="10" fill="${warn}">clearance top ${fi(ct)} · left ${fi(cL)} · right ${fi(cR)} → door ${fi(W-cL-cR)} × ${fi(H-ct)}</text>`;
  else s+=`<text x="${cx}" y="${ph-18}" text-anchor="middle" font-size="10" fill="${mute}">${(v.site||"")+(v.opening?" · "+v.opening:"")+(v.date?" · "+v.date:"")+(v.by_name?" · "+v.by_name:"")}</text>`;
  return s+`</svg>`;
}

async function loadScans(){ $("v_scans").innerHTML='<div class="empty">Loading scans…</div>'; try{ const r=await desk({action:"scans"}); SC=r.rows; }catch(e){ $("v_scans").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; } renderScans(); }
const FOLD={receipts:"Receipts",catalog:"Part photos",docs:"Documents",contracts:"Agreements",media:"Job photos"}; const fold=x=>FOLD[x]||(/^[0-9a-f]{8}-/.test(x)?"Job files":x);
function scCap(f){ if(f.receipt) return {b:(f.receipt.total?money(f.receipt.total):"⚑ no total")+" · "+(f.receipt.store||"—"),m:f.receipt.bought_at}; if(f.part) return {b:f.part.name,m:"part photo"}; return {b:f.name,m:fold(f.folder)+" · "+(f.updated_at||"").slice(0,10)}; }

function lbOpen(path){ const f=SC.find(x=>x.path===path); if(!f) return; LBI=f; const c=scCap(f); $("lbCap").textContent=c.b+" · "+c.m; $("lbRc").style.display=f.receipt?"":"none"; $("lbNew").href=f.url||"#";
  $("lbBody").className="lbb"; $("lbBody").innerHTML=f.kind==="image"?`<img src="${f.url}" onclick="lbZoom()">`:f.kind==="pdf"?`<iframe src="${f.url}"></iframe>`:/\.html?$/i.test(f.name)?`<iframe id="lbHtml"></iframe>`:`<div class="empty" style="padding:40px">${esc(f.name)} — open in new tab</div>`; $("lb").classList.add("on");

/* PHONE SCAN — the camera opens straight away (capture=environment); the shot is downscaled here, shown, and read at once. */
function scanPaper(){ $("scanFile").click(); }
async function startPaper(f){
  if(!f)return; const url=await downscale(f,1800); RSEL="new"; KIND=KIND||"receipt";
  if(TAB!=="rcpt"){ tab("rcpt"); }
  if(!RC){ let n=0; while(!RC&&n++<40) await new Promise(r=>setTimeout(r,150)); }
  if(!$("rcWork")) return;
  renderWork({id:"new",image_url:url,store:"",bought_at:new Date().toISOString().slice(0,10),total:null,file:f});
  $("rcWork").scrollIntoView({behavior:"smooth",block:"start"});
  if(AUTO_OCR){ AUTO_OCR=false; runOcr("new"); }
}
/* downscale on-device so a 12 MP phone shot is ~300 KB before OCR and upload; the browser honours EXIF orientation on <img> */
function downscale(f,max){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); if(sc>=1){res(img.src);return;} const cv=document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*sc); cv.height=Math.round(img.naturalHeight*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",.88)); }; img.onerror=()=>res(URL.createObjectURL(f)); img.src=URL.createObjectURL(f); }); }
$("scanFile").onchange=()=>{ const f=$("scanFile").files[0]; $("scanFile").value=""; AUTO_OCR=true; startPaper(f); };

$("rcFile").onchange=()=>{ const f=$("rcFile").files[0]; $("rcFile").value=""; if(!f)return; if(ATTACH){ const id=ATTACH; ATTACH=null; const img=new Image(); img.onload=async()=>{ const M=1600,sc=Math.min(1,M/Math.max(img.width,img.height)); const cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); try{ const j=await desk({action:"receipt_set",id,image:cv.toDataURL("image/jpeg",.85)}); const r=RC.find(x=>x.id===id); if(r) Object.assign(r,j.row); toast("scan attached"); await loadReceipts(); pickRc(id); }catch(e){toast(e.message,true);} }; img.src=URL.createObjectURL(f); return; } AUTO_OCR=false; startPaper(f); };
function pickRc(id){ RSEL=id; const r=RC.find(x=>x.id===id); document.querySelectorAll(".rr").forEach(e=>e.classList.toggle("on",e.getAttribute("data-id")===id)); renderWork(r); }

    <div style="display:flex;gap:8px;margin:2px 0 8px"><button class="sm ok" onclick="saveHeader('${r.id}')">${r.id==="new"?"Save receipt":"Save changes"}</button></div>

    <div style="display:flex;gap:8px;margin-top:8px"><button class="sm" onclick="addLine()">+ line</button><span style="flex:1"></span><button class="go" onclick="saveLines('${r.id}')">Save lines to inventory</button></div>
    
    <div class="ocr" id="ocrText" style="margin-top:10px">${esc(r.ocr_text||"")}</div></div></div></div>`;
  if(r.ocr_text){ OCR=r.ocr_text; linesFromText(OCR); }

async function runOcr(id){
  const r=id==="new"?null:RC.find(x=>x.id===id); const src=r?r.image_url:document.querySelector("#rcWork img").src;
  if(!window.Tesseract){ $("ocrMsg").textContent="No OCR — type the lines."; return; }
  $("ocrMsg").textContent="Reading…";
  try{ const res=await Tesseract.recognize(src,"eng",{logger:m=>{ if(m.status==="recognizing text") $("ocrBar").style.width=Math.round(m.progress*100)+"%"; }}); OCR=res.data.text; $("ocrText").textContent=OCR; linesFromText(OCR); $("ocrMsg").textContent=""; }
  catch(e){ $("ocrMsg").textContent="OCR failed: "+e.message; }
}
function linesFromText(t){

function pdWhen(t){ if(!t) return "\u2014"; const d=new Date(t), n=new Date();

let ST=null, STT=null, STSAVE=null;
async function loadSteel(){ const el=$("v_steel"); if(!SHT){ try{ SHT=await desk({action:"survey_targets"}); }catch(e){ el.innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; } }

/* the lists are DATA — catalog_options trk_sys / btm_trk (Kit Builder / Master Catalog edit them); these are only the fallback */
let TRK=[["m8","M8","m8_track","u_std"],["m10","M10","m10_track","u_std"],["e3","E3","e3_track","e3"],["e4","E4","e4_track","e4"]];
let BTM=[["u_std","U track","u_channel","U track",[{role:"lower_guide_roller",per:"lead",qty:1}]],["e3","E3 bottom","e3_bottom_track","E3 bottom track",[{role:"e3_end_guide",per:"side",qty:1},{role:"e3_mid_guide",per:"mid",qty:1}]],["e4","E4 bottom","e4_bottom_track","E4 bottom track",[{role:"e4_end_guide",per:"side",qty:1},{role:"e4_mid_guide",per:"mid",qty:1}]],["m8hd","M8 HD · in design","m8hd_bottom_track","M8 HD bottom track",[{role:"m8hd_guide_roller",per:"lead",qty:1}]]];
const TRK0=TRK.slice(), BTM0=BTM.slice();
function stLists(){ const o=(ST&&ST.options)||[]; const sys=o.filter(x=>x.group_key==="trk_sys"); if(sys.length) TRK=sys.map(x=>{ const d=x.data||{}, f=TRK0.find(t=>t[0]===x.opt_id)||[]; return [x.opt_id,x.name,d.role||f[2]||x.opt_id+"_track",d.bottom||f[3]||""]; });
  const bt=o.filter(x=>x.group_key==="btm_trk"); if(bt.length) BTM=bt.map(x=>{ const d=x.data||{}, f=BTM0.find(t=>t[0]===x.opt_id)||[]; return [x.opt_id,x.name,d.role||f[2]||"",x.name.replace(/ · in design$/,"")+(/track$/i.test(x.name)?"":" track"),d.guides||f[4]||[]]; }); }
function trkRole(k){ const t=TRK.find(x=>x[0]===k); return t?t[2]:k+"_track"; }
function btmRole(k){ const b=BTM.find(x=>x[0]===k); return b?b[2]:null; }

/* configuration → counts. "2L2R" → doors 4, sides 2 (a side is a group of leaves that fold together), mids = doors − 2·sides, leads = sides */
function cfgCounts(code){ const m=String(code||"").toUpperCase().match(/^(\d+)L(\d+)R$/); if(!m) return null; const L=+m[1],R=+m[2]; const sides=(L>0?1:0)+(R>0?1:0); const doors=L+R; return {doors,sides,leads:sides,joints:Math.max(0,L-1)+Math.max(0,R-1),mid:Math.max(0,L-2)+Math.max(0,R-2)}; }
function perQty(per,qty,c){ if(!c) return null; const m=per==="unit"?1:per==="side"?c.sides:per==="lead"?c.leads:per==="joint"?c.joints:per==="door"?c.doors:per==="mid"?c.mid:1; return m*(Number(qty)||1); }
function stRole(r){ return ((ST&&ST.roles)||[]).find(x=>x.role===r)||null; }
function stPart(r){ const R=stRole(r); if(!R||!R.parts.length) return null; return R.parts.find(p=>p.accepted)||R.parts[0]; }
function stCostLine(label, role, qty, unit){ const p=stPart(role); const R=stRole(role);
  if(!R) return `<div class="cost"><span>${esc(label)}</span><span class="na">no role in the book</span></div>`;

function pcsCover(have,need,haveFt,needFt){ have=(have||[]).filter(x=>x.ft>0); need=(need||[]).filter(x=>x.ft>0); if(!have.length||!need.length) return haveFt>=needFt; const sticks=[]; have.forEach(x=>{ for(let i=0;i<(Number(x.n)||1);i++) sticks.push(Number(x.ft)); }); sticks.sort((a,b)=>b-a); const want=[]; need.forEach(x=>{ for(let i=0;i<(Number(x.n)||1);i++) want.push(Number(x.ft)); }); want.sort((a,b)=>b-a); for(const w of want){ const i=sticks.findIndex(s=>s>=w); if(i<0) return false; sticks[i]-=w; } return true; }
function pcsEditor(l,who){ l=l||[]; const rows=l.map((x,i)=>`<div class="pc"><input inputmode="numeric" value="${Number(x.n)||1}" onchange="pcSet('${who}',${i},'n',this.value)"><span class="eq">×</span><input class="len" value="${x.ft?fmtFt(Number(x.ft)):""}" placeholder="—" onchange="pcSet('${who}',${i},'ft',this.value)"><span class="x" onclick="pcDrop('${who}',${i})">✕</span></div>`).join(""); return `<div class="pcs">${rows}<div class="pc"><button class="sm ghost" onclick="pcAdd('${who}')">＋ piece</button></div></div>`; }
function pcList(who){ return who==="job"?(stForm().track_pieces||[]).map(x=>({n:x.n,ft:x.ft})):who==="btm"?(stForm().btm_pieces||[]).map(x=>({n:x.n,ft:x.ft})):STK_PCS; }
function pcCommit(who,l){ if(who==="job") stSet("track_pieces", l, "typed"); else if(who==="btm") stSet("btm_pieces", l); else { STK_PCS=l; renderSteel(); } }
function btmSame(){ stSet("btm_pieces", (stForm().track_pieces||[]).map(x=>({n:x.n,ft:x.ft}))); }
function stBtmCost(k,pcsL,ft){ const role=btmRole(k); const R=stRole(role); const b=BTM.find(x=>x[0]===k); const label=b?b[3]:k; if(!R) return `<div class="cost"><span>${esc(label)}</span><span class="na">no role in the book</span></div>`;
  const parts=(R.parts||[]).map(p=>({p,len:stickFt(p)})).filter(x=>x.len>0).sort((a,b)=>a.len-b.len);
  if(parts.length) return stTrackCostFor(label,parts,pcsL,ft);
  const p=stPart(role); if(!p) return `<div class="cost"><span>${esc(label)} · ${fmtFt(ft)}</span><span class="na">no part — ${k==="e4"?"BT-01":k==="m8hd"?"BT-02":"ask"}</span></div>`;
  return `<div class="cost"><span>${esc(label)} · ${fmtFt(ft)} · ${esc(p.code)}${p.vendor?" · "+esc(p.vendor):""}</span><span class="na">${p.unit_cost!=null&&p.accepted?money(p.unit_cost*ft):(p.cost_known&&!p.accepted?"link not accepted — Part Mapper":"$/ft unknown — "+esc(p.cost_source||"ask"))}</span></div>`; }
function pcAdd(who){ const l=pcList(who); l.push({n:1,ft:0}); pcCommit(who,l); }
function pcDrop(who,i){ const l=pcList(who); l.splice(i,1); pcCommit(who,l); }
function pcSet(who,i,k,v){ const l=pcList(who); if(!l[i]) return; l[i][k]=k==="n"?Math.max(1,Math.round(Number(v)||1)):Math.round(parseFtIn(v)*192)/192; pcCommit(who,l); }
/* track cost: each needed piece takes the shortest stock stick that fits (parts' lengths from the qualifier / descr) */
function stickFt(p){ const t=(p.qualifier||"")+" "+(p.descr||""); let m; if((m=t.match(/(\d+(?:\.\d+)?)\s*(?:ft|FT|′|')/))) return Number(m[1]); if((m=t.match(/(\d+(?:\.\d+)?)\s*(?:inch|in\b|″|")/i))) return Number(m[1])/12; return 0; }
function stTrackCost(trk,pcsL,ft){ const R=stRole(trkRole(trk)); const label=trk.toUpperCase()+" track"; if(!R) return `<div class="cost"><span>${label}</span><span class="na">no role in the book</span></div>`; const parts=(R.parts||[]).map(p=>({p,len:stickFt(p)})).filter(x=>x.len>0).sort((a,b)=>a.len-b.len); if(!parts.length) return `<div class="cost"><span>${label} · ${fmtFt(ft)}</span><span class="na">no part — ${trk==="e4"?"TRK-02":"ask"}</span></div>`; return stTrackCostFor(label,parts,pcsL,ft); }
function stTrackCostFor(label,parts,pcsL,ft){ const want=[]; (pcsL||[]).filter(x=>x.ft>0).forEach(x=>{ for(let i=0;i<(Number(x.n)||1);i++) want.push(Number(x.ft)); }); if(!want.length) want.push(ft);
  const use={}; let bad=null; for(const w of want){ const x=parts.find(q=>q.len>=w-1e-6); if(!x){ bad=w; continue; } const c=x.p.code; use[c]=use[c]||{n:0,p:x.p,len:x.len}; use[c].n++; }
  const out=[]; let total=0, na=false; for(const c in use){ const u=use[c]; const line=`${label} · ${u.n} × ${fmtFt(u.len)} stick · ${esc(c)}${u.p.vendor?" · "+esc(u.p.vendor):""}`; if(u.p.unit_cost!=null){ total+=u.p.unit_cost*u.n; out.push(`<div class="cost"><span>${line}</span><span class="ok">${money(u.p.unit_cost)} × ${u.n} = ${money(u.p.unit_cost*u.n)}</span></div>`); } else { na=true; out.push(`<div class="cost"><span>${line}</span><span class="na">${u.p.cost_known&&!u.p.accepted?"link not accepted — Part Mapper":"cost unknown — "+esc(u.p.cost_source||"ask")}</span></div>`); } }
  if(bad!=null) out.push(`<div class="cost"><span>${label} · a ${fmtFt(bad)} piece</span><span class="na">longer than any stick in the book</span></div>`); return out.join(""); }

    <details style="margin-top:12px"><summary class="m" style="cursor:pointer;font-family:var(--fm);font-size:11px;color:var(--mute)">installers</summary>
     <div style="padding:6px 0">${retire}</div>

<tr><td colspan="3">Total</td><td class="n">${money(b.total)}</td></tr></tfoot></table>${b.note?`<div class="note">${esc(b.note)}</div>`:""}</main><footer>Tungsten Royce · Bifolded</footer><scr`+`ipt>window.onload=()=>setTimeout(()=>print(),300)</scr`+`ipt>`;
  const w=window.open("","_blank"); if(!w){ toast("pop-up blocked",true); return; } w.document.write(html); w.document.close(); }

function jbTotHtml(ch){ const sum=(f)=>ch.reduce((a,c)=>a+f(c),0); const cost=sum(c=>(Number(c.cost)||0)*(Number(c.qty)||1)); const toCust=sum(c=>c.charge_to==="customer"?(Number(c.charge)||0)*(Number(c.qty)||1):0); const toInst=sum(c=>c.charge_to==="install"?(Number(c.charge??c.cost)||0)*(Number(c.qty)||1):0); const absorb=sum(c=>c.charge_to==="tr"?(Number(c.cost)||0)*(Number(c.qty)||1):0); return `<span>cost <b>${money(cost)}</b></span><span>to customer <b>${money(toCust)}</b></span><span>to the installer <b>${money(toInst)}</b></span><span>TR absorbs <b>${money(absorb)}</b></span>`; }
function jbPatch(){ const ch=JB.charges||[]; const t=$("jbTot"); if(t) t.innerHTML=jbTotHtml(ch); for(const bl of (JB.bills||[])){ const el=document.querySelector(`#v_job .cost[data-bill="${bl.id}"] b`); if(el) el.textContent=money(bl.total); } for(const c of ch){ const row=document.querySelector(`#v_job .chg[data-id="${c.id}"]`); if(!row) continue; const a=row.querySelector(".amt"); if(a) a.textContent=jbAmt(c); for(const el of row.querySelectorAll("input,select")){ if(el===document.activeElement) continue; const h=el.getAttribute("onchange")||""; const m=h.match(/','(\w+)'/); if(!m) continue; const k=m[1]; const val=c[k]==null?"":String(c[k]); if(el.value!==val) el.value=val; } } }
async function jbCh(id,k,v){ const c=(JB.charges||[]).find(x=>x.id===id); if(!c) return; c[k]=v; jbPatch(); try{ const r=await desk({action:"charge_set",id,kind:c.kind,label:c.label,vendor_id:c.vendor_id||null,qty:c.qty,cost:c.cost,charge:c.charge,charge_to:c.charge_to,installer_id:c.installer_id||null,ref:c.ref,note:c.note}); Object.assign(c,r.charge); if(r.bill){ const i=(JB.bills||[]).findIndex(b=>b.id===r.bill.id); if(i>=0) JB.bills[i]=r.bill; } if(k==="charge_to"||k==="kind"||(r.bill&&document.activeElement&&!document.activeElement.closest(".chg"))) renderJob(); else jbPatch(); }catch(e){ toast(e.message,true); } }
async function jbChDel(id){ try{ await desk({action:"charge_del",id}); await jobPull(); }catch(e){ toast(e.message,true); } }
/* ---- push (1.9): the office phone hears when a customer / contractor sends something through their link ---- */
async function pushHint(){ if(!("serviceWorker" in navigator)) return; try{ await navigator.serviceWorker.register("sw.js"); }catch(e){}
  if(!("PushManager" in window)||!("Notification" in window)) return;
  if(Notification.permission==="granted"){ try{ const reg=await navigator.serviceWorker.ready; const s=await reg.pushManager.getSubscription(); if(s){ post("tr-crew",{action:"push_subscribe",subscription:s.toJSON(),ua:navigator.userAgent}); return; } }catch(e){} }
  if(Notification.permission!=="denied") $("bell").style.display=""; }
async function enablePush(){ try{ const perm=await Notification.requestPermission(); if(perm!=="granted") return; const v=await post("tr-crew",{action:"vapid"}); if(!v.key){ toast("notifications are not switched on at the office yet",true); return; }
  const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:v.key}); await post("tr-crew",{action:"push_subscribe",subscription:sub.toJSON(),ua:navigator.userAgent}); $("bell").style.display="none"; toast("you'll hear when something comes in"); }catch(e){ toast(e.message,true); } }
window.enablePush=enablePush;
