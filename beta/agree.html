<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TR Agreement 2.3</title>
<!--
  TR AGREEMENT 1.1 · Tungsten Royce · BY BIFOLDED
  Copyright Tungsten Royce. Proprietary.

  Two faces, one file. The office clicks through a pre-populated list; the
  customer receives a document generated from those clicks. There is no second
  place the wording lives, so the two cannot drift apart. Both sides are set in
  the same type, on the same paper, in the same colours — the internal side is
  not a lesser thing, and treating it as one is how house style dies.

  NOT LEGAL ADVICE. The terms are drafted from published commercial practice and
  statute — UCC Article 2 as adopted in California and
  Magnuson-Moss — and are written to be defensible and readable. They are NOT a
  substitute for a California construction attorney reading them first. The three
  places most likely to need her: the deposit recovery in clause 7, the warranty
  in clause 5, and the cancellation notice, which needs the seller address and
  the date filled in and must be supplied in duplicate.
-->
<style>
/* ============================================================================
   TYPE — Helvetica, and only Helvetica.
   One family set properly beats two families set carelessly, and an all-Swiss
   document is the oldest "quality manufacturer" signal there is. What makes it
   read as designed rather than generated is not the typeface, it is the five
   things below, every one of which the default gets wrong:
     · two weights only, and hierarchy carried by size and air, not by bold
     · caps always tracked (0 tracking on caps is the loudest amateur tell)
     · tabular numerals, so a column of prices does not jitter
     · measure held near 62 characters, never the width of the window
     · rules in a soft grey, never hairline black
   Long prose runs at a slightly larger size and looser leading than the UI,
   which is what stops a wall of Helvetica reading as a spreadsheet.
============================================================================ */
:root{
  --sans:"Helvetica Neue",Helvetica,"Inter",Arial,"Liberation Sans",sans-serif;

  /* Deep purple. Near-black with plum in it for the ink, a true aubergine for
     structure, and one lighter violet used sparingly enough to still mean
     something when it appears. */
  --ink:#201829; --ink2:#3E344A; --soft:#6E6579; --faint:#968EA0;
  --plum:#41275C;         /* structure: rules, marks, the selected state */
  --plum2:#6B4A8F;        /* the one bright note */
  --plumSoft:#F4F0F7;     /* tint */
  --paper:#FBF9FB; --card:#FFFEFF; --line:#CFCAD3; --rule:#BAB1C1;
  --gold:#9C7A3E; --goldSoft:#FBF6EC;
  --alert:#8C2B48;        /* a wine that lives beside purple, not a fire-engine red */
  --ok:#2F6B4F;

  --s0:12.5px; --s1:14.5px; --s2:16.5px; --s3:20px; --s4:26px; --s5:33px; --s6:46px;
  --measure:33rem;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--paper);color:var(--ink);
  font:var(--s1)/1.5 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.005em}
p,li{font-size:var(--s2);line-height:1.62;color:var(--ink2);max-width:var(--measure);
  margin:0 0 1.05em;letter-spacing:-.004em}
h1,h2,h3{font-weight:600;letter-spacing:-.022em;margin:0}
h1{font-size:var(--s5);line-height:1.1}
h2{font-size:var(--s4);line-height:1.18}
h3{font-size:var(--s3);line-height:1.25;letter-spacing:-.016em}
.eyebrow{font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--plum);
  font-weight:700;margin:0 0 12px}
.lede{font-size:var(--s3);line-height:1.5;color:var(--ink2);max-width:var(--measure);letter-spacing:-.012em}
.num{font-variant-numeric:tabular-nums}
a{color:var(--plum2)}
hr{border:none;border-top:1px solid var(--rule);margin:40px 0}

/* ---- shell ---- */
.wrap{max-width:1060px;margin:0 auto;padding:0 34px}
header.tr{background:linear-gradient(120deg,#1B1324 0%,#271A33 55%,#33223F 100%);
  color:#F4F0F7;padding:19px 0;border-bottom:3px solid var(--plum2)}
header.tr .wrap{display:flex;align-items:center;gap:15px}
header.tr .mk{height:38px;width:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
header.tr .co{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:500}
header.tr .sub{font-size:10.5px;letter-spacing:.12em;color:#A497B4;text-transform:uppercase;margin-top:4px}
header.tr .who{margin-left:auto;text-align:right;font-size:var(--s0);color:#B5A8C2;line-height:1.45}
header.tr .who b{color:#F4F0F7;font-weight:500}

/* ---- rail ---- */
.rail{display:flex;border-bottom:1px solid var(--line);background:var(--card)}
.rail .r{flex:1;padding:14px 8px 12px;text-align:center;font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--faint);border-bottom:2px solid transparent;cursor:pointer;
  font-weight:500;transition:color .15s,border-color .15s}
.rail .r:hover{color:var(--soft)}
.rail .r.on{color:var(--plum);border-bottom-color:var(--plum2)}

main{padding:62px 0 100px;min-height:60vh}

/* ---- option cards ---- */
.opts{display:flex;flex-direction:column;gap:12px;margin:26px 0 0;max-width:44rem}
.opt{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:22px 24px;
  transition:border-color .14s,box-shadow .14s;position:relative}
.opt.on{border-color:var(--plum);box-shadow:inset 3px 0 0 var(--plum2)}
.opt .t{font-size:var(--s2);font-weight:500;letter-spacing:-.014em}
.opt .c{font-size:var(--s1);color:var(--soft);margin-top:6px;line-height:1.55;max-width:30rem}
.opt .d{position:absolute;right:24px;top:21px;font-size:var(--s1);color:var(--plum);
  font-variant-numeric:tabular-nums;font-weight:500}
.opt .rec{display:inline-block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--plum2);border:1px solid var(--plum2);border-radius:2px;padding:2px 7px;
  margin-left:10px;vertical-align:2px;font-weight:500}

/* ---- fields: a line, not a box ---- */
.field{margin:24px 0;display:flex;flex-direction:column}
/* paper-form order: you write ON the line, the descriptor sits UNDER it */
.field label{display:block;order:2;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--soft);margin:7px 0 0;font-weight:500}
.field input,.field select,.field textarea{order:1}
.field .help{order:3}
.field input,.field select,.field textarea{
  font:var(--s2)/1.4 var(--sans);color:var(--ink);background:transparent;
  border:none;border-bottom:1px solid var(--rule);padding:8px 2px;width:100%;max-width:28rem;
  border-radius:0;font-variant-numeric:tabular-nums;letter-spacing:-.006em}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-color:var(--plum2)}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
.field .help{font-size:var(--s1);color:var(--soft);margin-top:7px;max-width:30rem;line-height:1.5}
.inline{display:flex;gap:28px;flex-wrap:wrap}
.inline .field{margin:0;flex:0 0 auto}
.inline .field input{width:7.5rem}
/* grow-fields (flex:1) get the full row — names must never be squeezed */
.inline .field[style*="flex:1"] input{width:100%;max-width:none}
textarea{font:var(--s2)/1.55 var(--sans);color:var(--ink);background:var(--card);
  border:1px solid var(--rule);padding:12px 14px;width:100%;max-width:33rem;border-radius:2px}
textarea:focus{outline:none;border-color:var(--plum2)}

/* ---- chips ---- */
.chip{display:inline-block;font:500 var(--s1)/1 var(--sans);border:1px solid var(--line);
  background:var(--card);border-radius:2px;padding:10px 15px;cursor:pointer;color:var(--ink2);
  letter-spacing:-.004em;transition:border-color .12s,color .12s,background .12s}
.chip:hover{border-color:var(--plum2);color:var(--plum)}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.needs{border-bottom-color:var(--alert) !important;background:#FDF5F7}

/* ---- buttons ---- */
button.go{font:500 var(--s1)/1 var(--sans);letter-spacing:.03em;background:var(--plum);color:#fff;
  border:1px solid var(--plum);border-radius:2px;padding:15px 30px;cursor:pointer;
  transition:background .14s}
button.go:hover{background:#331F49}
button.ghost{font:500 var(--s1)/1 var(--sans);letter-spacing:.03em;background:transparent;
  color:var(--ink2);border:1px solid var(--rule);border-radius:2px;padding:15px 26px;cursor:pointer}
button.ghost:hover{border-color:var(--plum2);color:var(--plum)}

/* ---- summary ---- */
.summary{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--plum2);
  padding:32px 34px;max-width:40rem}
.summary p{font-size:var(--s3);line-height:1.5;color:var(--ink);max-width:none;letter-spacing:-.014em}
.spec{width:100%;max-width:44rem;border-collapse:collapse;margin-top:10px}
.spec td{padding:13px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:var(--s1)}
.spec td:first-child{width:11rem;color:var(--soft);font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;padding-top:16px;font-weight:500}
.spec td:last-child{text-align:right;color:var(--plum);width:7.5rem;font-weight:500;
  font-variant-numeric:tabular-nums}
.spec .v{font-size:var(--s2);color:var(--ink);letter-spacing:-.01em}
.spec .n{color:var(--soft);font-size:var(--s1);display:block;margin-top:4px;line-height:1.5;max-width:28rem}

/* ---- notes ---- */
.terms{max-width:var(--measure)}
.terms h3{font-size:var(--s2);margin:34px 0 9px;color:var(--plum)}
.terms p,.terms li{font-size:var(--s1);line-height:1.62}
.note{background:var(--plumSoft);border:1px solid #E3D9EC;border-left:3px solid var(--plum2);
  padding:18px 22px;max-width:var(--measure);margin:24px 0}
.note p{font-size:var(--s1);margin:0;color:#4A3A5C}
.warn{background:#FCF4F6;border-color:#EBD5DC;border-left-color:var(--alert)}
.warn p{color:#6B2F42}
.gold{background:var(--goldSoft);border-color:#EADCC2;border-left-color:var(--gold)}
.gold p{color:#5C4A28}

/* ---- milestones ---- */
.mile{display:flex;gap:20px;padding:19px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.mile .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--rule);margin-top:7px;flex:0 0 auto}
.mile.now .dot{background:var(--plum2);border-color:var(--plum2);box-shadow:0 0 0 4px rgba(107,74,143,.15)}
.mile .b{flex:1}
.mile .t{font-size:var(--s2);font-weight:500;letter-spacing:-.012em}
.mile .c{font-size:var(--s1);color:var(--soft);margin-top:4px;max-width:30rem;line-height:1.55}
.mile .w{font-size:var(--s1);color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Print is a different medium, not a narrow screen. The stacking rule below
   is scoped to `screen` for exactly this reason — it was leaking into the PDF
   and breaking the specification table into stubs. */
@media print{
  header.tr,.rail,.noprint{display:none !important}
  body{background:#fff;font-size:10.5pt;color:#1a1a1a}
  main{padding:0} .wrap{max-width:none;padding:0}
  p,li{font-size:10pt;color:#2a2a2a;max-width:none}
  .eyebrow{color:#5a5a5a}
  h1{font-size:22pt} h3{font-size:12.5pt}
  .note{background:#fafafa;border-color:#ddd;break-inside:avoid}
  .summary{break-inside:avoid;padding:20px 24px}
  .spec{max-width:none} .spec tr{break-inside:avoid}
  .spec td:first-child{width:9rem}
  .terms h3{break-after:avoid} .terms p{orphans:2;widows:2}
  .mile{break-inside:avoid}
  hr{margin:24px 0}
  a{color:#1a1a1a;text-decoration:none}
}
@media screen and (max-width:760px){
  .wrap{padding:0 20px}
  h1{font-size:var(--s4)}
  .rail .r{font-size:9.5px;letter-spacing:.08em}
  .opt .d{position:static;display:block;margin-top:10px}
  .spec td:first-child{width:auto;display:block;padding-bottom:0;border:none}
  .spec td{display:block;text-align:left !important;padding:6px 0}
  .spec tr{display:block;border-bottom:1px solid var(--line);padding:10px 0}
}

.help{display:none!important}
</style>
</head>

"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(num(n)).toLocaleString();
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
const fmtDate=d=>d.toLocaleDateString("en-US",{day:"numeric",month:"long",year:"numeric"});
const today=()=>fmtDate(new Date());
const plus=w=>{const x=new Date();x.setDate(x.getDate()+w*7);return fmtDate(x)};

/* ============================================================================
   THE AGREEMENT.
   Two jobs at once, and they pull against each other unless you are careful.
   It has to hold up if it is ever argued over — which means the specification
   is incorporated, the deposit is a cost recovery rather than a bare
   forfeiture, the inspection window is defined, the right to cure is
   preserved, and the lead time is an estimate with its conditions named.
   And it has to read like something made by people who are good at what they
   do — because it is the first thing the customer receives that we made, and
   they will judge the doors by it.
   The way both get done is that every clause is written in sentences a person
   can read once. Legalese is not what makes a contract enforceable; a clear
   meeting of minds is. The plain wording IS the legal strategy.
============================================================================ */

/* The payment schedule. Every draw is tied to something that either happened
   or did not — never to a date on a calendar, because a date arrives whether
   the work did or not, and that is how payment arguments start. */
function schedule(total){
  const t=num(total); if(!t)return [];
  return [
   {k:"order", pct:0.50, n:"On signing",
    w:"Half down, on the rough tape and the Concept Drawing. Covers drafting, engineering and the material we commit to your job."},
   {k:"done",  pct:0.50, n:"On delivery",
    w:"The balance. Change orders approved during fabrication are charged as they are approved, not held to the end."}
  ].map(x=>Object.assign({},x,{amt:t*x.pct}));
}

/* ============================================================================
   THE LASER SURVEY.
   Up to this point every dimension in the agreement is a tape measure, and the
   document says so. A survey changes that: the readings are by laser,
   there are three across each axis, and the smallest of them is the one that
   governs — because a door has to pass the tightest point of the opening, not
   the average of it.
   Bringing the survey INTO the agreement is what turns "we will measure later"
   from a promise into a record. It also lets the document say the one thing a
   tape measure can never tell you: how far out of square the hole actually is,
   which is the number that decides whether this is an ordinary install or an
   afternoon of scribing.
============================================================================ */
var SURVEYS=[];
function surveyOf(o){ return o && o.survey ? o.survey : null }
function anySurvey(){ return (D.openings||[]).some(o=>surveyOf(o)) }
function readLaser(txt){
  let j=null; try{ j=JSON.parse(txt) }catch(e){ return {err:"That is not a measurement file."} }
  if(!j||j.app!=="bifolded-laser") return {err:"That file did not come from the laser tool."};
  const md=j.maxDoor||{};
  const w=num(md.widthIn), h=num(md.heightIn);
  if(!w||!h) return {err:"That file has no calculated opening in it — the survey was saved before Calculate was pressed."};
  const wr=(j.widthReadings||[]).map(x=>num(x.total)).filter(x=>x>0);
  const hr=(j.heightReadings||[]).map(x=>num(x.total)).filter(x=>x>0);
  return {survey:{
    date:j.date||"", job:j.job||"",
    w:w, h:h,
    wMin:wr.length?Math.min.apply(null,wr):w, wMax:wr.length?Math.max.apply(null,wr):w,
    hMin:hr.length?Math.min.apply(null,hr):h, hMax:hr.length?Math.max.apply(null,hr):h,
    nW:wr.length, nH:hr.length,
    clearances:j.clearances||null, by:""
  }};
}
/* Out of square is the spread between the widest and narrowest reading on an
   axis. An eighth is nothing; a half inch is a conversation to have before
   anyone signs, not after somebody is standing there with the doors. */
function spread(s){ return {w:Math.max((s.wMax||0)-(s.wMin||0),0), h:Math.max((s.hMax||0)-(s.hMin||0),0)} }
function squareCall(s){
  const sp=spread(s), worst=Math.max(sp.w,sp.h);
  if(worst<0.125) return {k:"true",  t:"Square within an eighth", c:"Nothing to allow for."};
  if(worst<0.375) return {k:"minor", t:"Slightly out of square",
    c:"Normal for a building. Absorbed by the jamb gaps without anybody noticing."};
  if(worst<0.75)  return {k:"real",  t:"Out of square",
    c:"Enough to matter. The drawing will show how it is taken up, and the install allows time for scribing."};
  return {k:"bad", t:"Well out of square",
    c:"This needs a decision before the doors are made — packing the opening, scribing the jambs, or both. We will show you the options on the drawing."};
}

  if(!D.taxOff&&!(num(D.taxRate)>0))m.push("Sales tax rate — 0.0925 for California, or take the tax off deliberately");

  D.custom.forEach(c=>{ if(!(c.note||"").trim())m.push((OPT[c.k]||{n:c.k}).n+" — describe the custom") });
  return m;
}

/* ============================================================================
   CLADDING — its own page, and only when it applies.
   Cladding is the part of a door that most often goes wrong on paper, because
   three separate people each assume somebody else owns it: the architect draws
   a profile, the builder assumes we are fixing it, and we assume the profile
   came with a securement detail. It did not.
   So this page names four things and refuses to be vague about any of them:
   what it is made of, what shape it is, HOW IT IS HELD ON, and what it weighs.
   The last one is not decoration. Cladding is dead load hanging off a moving
   leaf, and it is the number that decides whether the track you quoted is
   still the right track. Getting that wrong is a set of doors that sag in a
   year, and nobody finds out until they do.
============================================================================ */
const CLAD_MATERIAL=[
 {id:"alu",  n:"Aluminium Sheet",        lb:1.45, ph:true, c:"Powder-coated to your colour. The lightest way to make a door stop needing you."},
 {id:"cop",  n:"Copper",                 lb:2.30, ph:true, c:"Lives, patinates, and never looks the same twice."},
 {id:"steel",n:"Steel / Weathering Steel",lb:5.10, ph:true, c:"Heavy, and the reason people want it is exactly why it is heavy."},
 {id:"cedar",n:"Cedar",                  lb:1.05, ph:true, c:"Light, stable, and the traditional answer."},
 {id:"ipe",  n:"Ipe",                    lb:3.60, ph:true, c:"Dense hardwood. Beautiful, and it will change the hardware conversation."},
 {id:"oak",  n:"White Oak",              lb:2.55, ph:true, c:"Matches a timber interior face."},
 {id:"comp", n:"Composite / Phenolic",   lb:2.10, ph:true, c:"Stable and flat, and it does not move with the weather."},
 {id:"oth",  n:"Other — As Specified",   lb:0,    c:"Described on the drawing; weight to be confirmed before hardware is ordered."}
];
/* A profile is not just a look — a louvre or a shiplap laps over itself, so
   the area of material is greater than the area of the door it covers. The
   factor is what stops us ordering the flat-panel quantity for a lapped
   profile, which is a mistake that only shows up at the end. */
const CLAD_PROFILE=[
 {id:"flat", n:"Flat Panel",            f:1.00, c:"One plane, no shadow line."},
 {id:"ship", n:"Shiplap",               f:1.15, c:"A rebated lap — a fine shadow between boards."},
 {id:"tg",   n:"Tongue and Groove",     f:1.18, c:"Boards that lock into each other. The tightest joint."},
 {id:"lou15",n:"Louvre, 15°",           f:1.42, c:"Angled blades. Air and light through, no view through."},
 {id:"bnb",  n:"Board and Batten",      f:1.28, c:"Wide boards with a batten over each joint."},
 {id:"oth",  n:"Custom — As Drawn",     f:1.20, c:"To the profile on the drawing."}
];
/* HOW IT IS HELD ON is the clause that stops the argument. Each carries its
   own weight allowance, because adhesive and cleats are not free either. */
const CLAD_MOUNT=[
 {id:"cleat",n:"Concealed Cleat",       lb:0.35, ph:true,
  c:"A hidden interlocking cleat. Nothing visible on the face, and it comes off again if it ever has to."},
 {id:"zclip",n:"Z-clip",                lb:0.30, ph:true,
  c:"Interlocking extrusions top and bottom. Fast, concealed, and it allows the panel to move."},
 {id:"mech", n:"Mechanically Fastened", lb:0.15, ph:true,
  c:"Screwed or riveted through the face, usually in a deliberate pattern. Honest and visible."},
 {id:"adhes",n:"Structural Adhesive",   lb:0.28, ph:true,
  c:"Bonded to the substrate. Nothing on the face at all, and it is permanent."},
 {id:"both", n:"Adhesive and Mechanical",lb:0.42, ph:true,
  c:"Belt and braces. What we use where the panel is heavy or the exposure is hard."},
 {id:"oth",  n:"By Others — Their Detail",lb:0,
  c:"Their drawing, their fixings, their responsibility. We supply the door prepared to receive it."}
];
/* Base leaf weight before cladding, per square foot. Placeholders until the
   shop weighs a few real doors — and the page says so rather than pretending. */
const LEAF_LB_SQFT={rsb:4.6, tb:3.9, t24:5.4, rse:5.8, "":4.8};
/* What the hardware will actually carry, per leaf. */
const HW_RATING={m8:500, m10:1100, e3:0, e4:350, piv:250};

function cladOn(){ return !!(D.clad&&D.clad.on) }
function cladDef(){ return {on:false, material:"", profile:"", mount:"", sides:1,
  thick:"", note:"", byOthers:false, fixedBy:"" } }
function clad(){ D.clad=Object.assign(cladDef(),D.clad||{}); return D.clad }
function cladFind(list,id){ return list.find(x=>x.id===id)||null }

/* The weight sum, shown in full so nobody has to trust it. */
function cladWeight(){
  const c=clad();
  const m=cladFind(CLAD_MATERIAL,c.material), pr=cladFind(CLAD_PROFILE,c.profile),
        mt=cladFind(CLAD_MOUNT,c.mount);
  const sides=Math.max(+c.sides||1,1);
  const rows=[], leaves=[];
  (D.openings||[]).forEach(o=>{
    const n=Math.round(num(o.leaves))||0; if(!n||!num(o.w)||!num(o.h))return;
    const leafSqFt=(num(o.w)/n)*num(o.h)/144;
    const base=leafSqFt*(LEAF_LB_SQFT[D.spec.style]||LEAF_LB_SQFT[""]);
    const skin=m?leafSqFt*m.lb*(pr?pr.f:1)*sides:0;
    const fix=mt?leafSqFt*mt.lb*sides:0;
    leaves.push({nm:o.nm,leafSqFt,base,skin,fix,total:base+skin+fix,n});
  });
  const hw=HW_RATING[D.spec.hw]===undefined?null:HW_RATING[D.spec.hw];
  const heaviest=leaves.length?Math.max.apply(null,leaves.map(x=>x.total)):0;
  return {leaves,heaviest,rating:hw,m,pr,mt,sides,
    over:(hw&&heaviest>hw*0.9)?true:false,
    hard:(hw&&heaviest>hw)?true:false};
}
function cladMissing(){
  if(!cladOn())return [];
  const c=clad(), m=[];
  if(!c.material)m.push("Cladding material");
  if(!c.profile)m.push("Cladding profile");
  if(!c.mount)m.push("How the cladding is held on");
  return m;
}

    ${help?`<div class="help" style="margin-top:8px">${help}</div>`:""}</div>`;

  h+=grp("material","What it is made of",CLAD_MATERIAL,

  </div>

    <textarea rows="2" oninput="setClad('note',this.value)" placeholder="the detail, the reveal, who supplies what">${esc(c.note)}</textarea></div>`;

  /* the weight, and what it means for the hardware */
  if(w.leaves.length){
    h+=`<div class="note ${w.hard?"warn":w.over?"gold":""}" style="margin-top:22px"><p>
      <b>Heaviest leaf: ${w.heaviest.toFixed(0)} lb.</b>

                :` No weight rating on file for the track you have specified — check it before ordering.`}
      ${w.hard?" <b>That is over the rating.</b> Move up a system or take weight out of the cladding; this is the failure that shows up as sag a year in."
        :w.over?" That is inside the rating but not by much. Worth a second look before the hardware is ordered."
        :w.rating?" Comfortably inside."
        :""}</p></div>
    <table class="spec" style="margin-top:10px">
      ${w.leaves.map(x=>`<tr><td>${esc(x.nm)}</td><td class="v">${x.leafSqFt.toFixed(1)} sq ft per leaf, ${x.n} leaves
        <span class="n">door ${x.base.toFixed(0)} lb · cladding ${x.skin.toFixed(0)} lb · fixings ${x.fix.toFixed(0)} lb</span></td>

/* ============================================================================

   anyone noticing for six weeks, and then it has cost six weeks. Saying it at

============================================================================ */
const CLAD_DOCS=[
 {k:"detail", n:"Cladding detail drawing",
  w:"A section through the cladding showing the profile, its thickness, and how it sits against the door face.",
  when:c=>true},
 {k:"secure", n:"Securement detail",
  w:"How it is fixed to our substrate — fastener type, spacing, and any adhesive specified. This is the one that stops the drawing being finished.",
  when:c=>c.mount==="oth"||(c.fixedBy&&!/tungsten|^us$|^we$/i.test(c.fixedBy))},
 {k:"weight", n:"Material weight, or the product data sheet",
  w:"Pounds per square foot. It decides which track goes in, and we will not order hardware without it.",
  when:c=>c.material==="oth"},
 {k:"colour", n:"Colour or finish reference",
  w:"A code, a chip, or a sample. Needed before the finish is applied, and sooner if we are matching the door finish to it.",
  when:c=>true},
 {k:"supply", n:"Confirmation of who supplies and who fixes",
  w:"In writing. Most cladding problems on a job are two trades each believing the other one owned it.",
  when:c=>!c.fixedBy},
 {k:"compliance", n:"Fire or energy compliance data",

];
function cladDocs(){
  /* If the job has no cladding, it has no cladding paperwork. This guard was
     missing and the primary contract was listing cladding documents as
     outstanding on jobs that will never have any — which would have been the
     fastest possible way to teach people to ignore that list. */
  if(!cladOn())return [];
  const c=clad();
  c.docs=c.docs||{};
  const base=CLAD_DOCS.filter(d=>d.when(c)||c.docs[d.k]);
  const extra=(c.extraDocs||[]).map((x,i)=>({k:"x"+i,n:x.n,w:x.w||"",custom:true,i}));
  return base.concat(extra);
}
function cladOutstanding(){
  const c=clad();
  return cladDocs().filter(d=>!((c.docs||{})[d.k]||{}).have);
}
function docState(k){ const c=clad(); c.docs=c.docs||{}; c.docs[k]=c.docs[k]||{have:false,from:"",by:""}; return c.docs[k] }
window.setDoc=function(k,f,v){ const d=docState(k); d[f]=(f==="have")?!!v:v; render() };

/* ============================================================================
   WHAT THE CLOCK IS WAITING ON — the primary contract's version.
   The cladding page can carry the detail, but detail on page four is not what
   protects you when somebody who wanted a rush job rings up in week ten. What
   protects you is a short list in the body of the agreement, in their own
   hand, initialled — naming exactly what was outstanding on the day they
   signed and stating that the estimate moves day for day with it.
   This is a condition precedent, and it is the fairest kind: it costs the
   customer nothing if they send the thing, and it makes the consequence of
   not sending it visible before rather than after.
============================================================================ */
function openItems(){
  const out=[];
  cladOutstanding().forEach(d=>{ const st=(clad().docs||{})[d.k]||{};
    out.push({t:d.n, from:st.from||"", by:st.by||"", why:"cladding"}) });
  /* A selection nobody has made is the same kind of delay, and it catches
     people out far more often than paperwork does. */
  optOrder().forEach(k=>{ if(k==="timber"&&!woodRoute())return; if(k==="grade")return;
    if(!D.spec[k])out.push({t:(OPT[k]||{n:k}).n+" not yet chosen",from:"",by:"",why:"selection"}) });
  if(colorRoute()&&!String(D.color||"").trim())
    out.push({t:(colorRoute()==="stain"?"Stain":"Paint")+" colour still to be chosen from samples",from:"",by:"",why:"selection"});
  D.custom.forEach(c=>{ if(!(c.note||"").trim())
    out.push({t:(OPT[c.k]||{n:c.k}).n+" — the custom is not described",from:"",by:"",why:"selection"}) });
  if(!anySurvey())out.push({t:"The opening still to be surveyed with a laser",from:"Tungsten Royce",by:"",why:"survey"});
  return out;
}
function openItemsDoc(){
  const items=openItems();

  return `<div class="note gold"><p><b>Read this part twice.</b> ${items.length===1?"One thing is":items.length+" things are"}
  still outstanding, and the ${D.weeks?esc(D.weeks)+"-week ":""}estimate above <b>does not begin</b> until
  ${theirs.length?"they are":"it is"} with us. A fortnight late here is a fortnight later on delivery.</p></div>
  <table class="spec">
    ${items.map(x=>`<tr><td>${x.why==="survey"?"We do this":"Needed"}</td><td class="v">${esc(x.t)}</td>
      <td>${esc(x.from||"")}${x.by?`<div style="font-weight:400;color:var(--soft)">by ${esc(x.by)}</div>`:""}</td></tr>`).join("")}
  </table>
  ${theirs.length?routeDoc():""}
  ${theirs.length?`<div style="margin-top:26px;padding:22px 24px;border:1px solid var(--rule);background:var(--card);max-width:40rem">

    agreement does not start until the ${theirs.length===1?"item":"items"} listed above ${theirs.length===1?"is":"are"} with
    Tungsten Royce, and that any delay in providing ${theirs.length===1?"it":"them"} moves the delivery date by the same
    amount.</p>
    <div style="display:flex;gap:34px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1;min-width:9rem"><div style="border-bottom:1px solid var(--ink);height:30px"></div>
        <div style="font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:7px">Initial</div></div>
      <div style="flex:1;min-width:9rem"><div style="border-bottom:1px solid var(--rule);height:30px"></div>
        <div style="font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:7px">Date</div></div>
    </div></div>`:""}`;

/* ============================================================================
   TWO WAYS TO GET US WHAT WE NEED.
   The verification portal is the one we want used. It timestamps the upload,
   files it against the job, tells the sender it arrived, and — the part that
   actually matters — it means the information is not sitting in one person's
   inbox while everybody assumes it has been dealt with.
   The salesman route stays, because sometimes a contractor will simply not use
   a portal and chasing them is more expensive than forwarding an email. But it
   is the fallback, and it is labelled as one.
   What the salesman DOES own is the contract itself: they propagated it, they
   signed it, their name is at the top and at the bottom. Removing them from
   data collection is not the same as removing them from responsibility, and
   the document is careful about the difference.
============================================================================ */
const PORTAL_DEFAULT="https://verify.bifolded.com";
function portal(){ return (D.portal||PORTAL_DEFAULT).trim() }
function routeOf(){ return D.route==="rep" ? "rep" : "portal" }
window.setRoute=function(v){ D.route=v; render() };

function routePrep(){
  const r=routeOf(), out=cladOutstanding();
  return `<div style="margin-top:30px"><p class="eyebrow" style="margin-bottom:8px">How they send it to us</p>
  <p>The portal is the default — timestamped, filed against the job, <b>readable by the whole shop without asking anybody</b>.</p>
  <div class="opts" style="margin-top:16px">
    <div class="opt${r==="portal"?" on":""}" style="cursor:pointer" onclick="setRoute('portal')">
      <div class="t">Verification portal${r==="portal"?'<span class="rec">preferred</span>':""}</div>
      <div class="c">They upload it themselves, against this job.</div></div>
    <div class="opt${r==="rep"?" on":""}" style="cursor:pointer" onclick="setRoute('rep')">
      <div class="t">Through you</div>
      <div class="c">Everything routes to ${esc(D.rep||"you")} and you relay it. Only where a contractor will not use a portal.</div></div>
  </div>
  ${r==="portal"?`<div class="field" style="margin-top:16px"><label>Portal address</label>
    <input value="${esc(D.portal||PORTAL_DEFAULT)}" oninput="setF('portal',this.value)">
    <div class="help">Printed on their copy. Check it goes somewhere before you send an agreement with it on.</div></div>`:""}
  ${out.length?`<div class="note" style="margin-top:14px"><p>Either way, <b>you own this contract</b> — your name at the top,
    your signature at the bottom.</p></div>`:""}
  </div>`;
}
function routeDoc(){
  const r=routeOf();
  if(r==="rep"){
    return `<p style="font-size:var(--s1);color:var(--soft);margin-top:14px">Send them to
    <b style="color:var(--ink)">${esc(D.rep||"your contact at Tungsten Royce")}</b>${D.repEmail?" at "+esc(D.repEmail):""}.
    If any of it is easier as a phone call than a document, ring${D.repPhone?" "+esc(D.repPhone):""} — we would rather
    have it in five minutes on the phone than wait a fortnight for a PDF.</p>`;
  }
  return `<div style="margin-top:18px;padding:22px 24px;border:1px solid var(--rule);background:var(--card);max-width:40rem">
    <p style="margin:0 0 8px;font-size:var(--s1)"><b>Upload it here — ${esc(portal().replace(/^https?:\/\//,""))}</b></p>
    <p style="margin:0;font-size:var(--s1);color:var(--soft)">Quote <b style="color:var(--ink)">${esc(D.no||"your agreement number")}</b>
    and it files itself against your job. You get confirmation that it arrived, and so does the shop — which is the whole
    point. The person who needs your securement detail is a fabricator, not a salesman, and this way he can read it on
    the morning he needs it instead of ringing somebody who is out on a site visit.</p>
    <p style="margin:10px 0 0;font-size:var(--s1);color:var(--soft)"><b style="color:var(--ink)">Give the address to
    whoever is actually holding the information.</b> If your architect has the cladding detail and your builder has the
    fixing schedule, send them both here directly — you should not have to be the postman between your own trades and us.
    Anyone can upload against your number; nobody needs an account.</p>
    <p style="margin:12px 0 0;font-size:var(--s1);color:var(--soft)">If you would rather just send it to a person,
    ${esc(D.rep||"your contact")}${D.repEmail?" is at "+esc(D.repEmail):""}${D.repPhone?" · "+esc(D.repPhone):""} and will
    put it in for you.</p></div>`;
}

/* ---------------- CUSTOMER FACE: the agreement ---------------- */
function sentence(){
  const o=D.openings.filter(x=>num(x.w)&&num(x.h));
  const bits=[];
  const st=optName("style")||"unit";
  const tot=o.reduce((a,x)=>a+num(x.leaves),0);
  if(o.length===1){
    const x=o[0];
    bits.push(`a ${num(x.leaves)}-door ${st.toLowerCase()}, ${fmtIn(x.w)} wide by ${fmtIn(x.h)} tall`);
    if(x.move)bits.push(x.move.toLowerCase());
  }else if(o.length>1){
    bits.push(`${o.length} ${st.toLowerCase()} units, ${tot} doors in total`);
  }else bits.push(`a ${st.toLowerCase()}`);
  const tm=optName("timber"), fn=optName("finish"), gl=optName("glass"),
        cl=optName("clad"), hw=optName("hwFin"), au=optName("auto"), gr=optName("grade");
  if(tm)bits.push("in "+tm.toLowerCase());
  if(gr&&/premium/i.test(gr))bits.push("built to premium grade with the grain matched across the set");
  if(fn)bits.push(fn.toLowerCase().replace(/^sprayed/,"sprayed"));
  if(gl&&!/^solid/i.test(gl))bits.push("glazed with "+gl.toLowerCase());
  else if(/^solid/i.test(gl))bits.push("with solid timber panels");
  if(cl&&!/^none/i.test(cl))bits.push(cl.toLowerCase());
  if(hw)bits.push(hw.toLowerCase()+" hardware");
  if(au&&/motor/i.test(au))bits.push("motorised");
  return bits.join(", ")+".";
}
/* Feet and inches the way a person says them: 192 is "16 foot", not
   "16 foot 0 inches". A document that prints 0" is a document a machine wrote. */
function fmtIn(v){
  const n=num(v); if(!n)return "";
  const f=Math.floor(n/12), rem=n-f*12;
  const whole=Math.floor(rem);
  let a=Math.round((rem-whole)*16), b=16;
  while(a&&a%2===0){a/=2;b/=2}
  if(f&&!whole&&!a)return f+"\u2032";
  const inch=whole+(a?"-"+a+"/"+b:"")+"\u2033";
  return (f?f+"\u2032 ":"")+inch;
}

/* The taxable subtotal: base, plus every accepted invitation as a percentage OF THE BASE
   (never compounded), plus the rush upcharge flat, plus any custom upcharges flat. */
function subtotal(){
  let t=num(D.price);
  INVITE.forEach(v=>{ if(D.accepted[v.k])t+=num(D.price)*v.pct });
  if(D.rush)t+=num(D.rushCost);
  (D.upcharges||[]).forEach(u=>{ t+=num(u.amt)||0 });
  return cents(t);
}
/* Outside California there is no California sales tax to collect, and no casing package.
   Both follow from the one fact, so both read it from the same place. */
function outOfState(){ return String(D.shipState||"CA").toUpperCase() !== "CA" }
const NO_OOS = ["casingInt","casingExt"];   // what does not go out of state
function optOrder(){ return outOfState() ? OPT_ORDER.filter(k=>!NO_OOS.includes(k)) : OPT_ORDER }
function byCarrier(){ return outOfState() || num(D.deliveryMiles) > 200 }
function taxRate(){ return (D.taxOff || outOfState()) ? 0 : (num(D.taxRate)||0) }
/* Changing the state has to CLEAR the casing selections, not merely stop displaying them —
   a hidden selection that still rides the record is how a shop ends up cutting trim for
   Nevada. Cleared here, once, at the moment the fact changes. */
window.setShipState=function(v){
  const s=String(v||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,2);
  D.shipState=s;
  if(s&&s!=="CA"){
    // unconditional: a defaulted selection is still a selection, and the presets DO default
    // casingInt/casingExt. Leaving it set-but-hidden is how trim gets cut for Nevada.
    NO_OOS.forEach(k=>{ delete D.spec[k];
      const i=D.custom.findIndex(c=>c.k===k); if(i>=0)D.custom.splice(i,1); });
  }
  render();
};
/* Money is rounded to the cent HERE, not at display time, so the number the customer signs,
   the number stored on the quote and the number an invoice is raised from are the same number.
   An 8.5% invitation on 21,685 is 1,843.225 — a third of a cent that would otherwise travel
   all the way into a payment draw. */
function cents(v){ return Math.round((Number(v)||0)*100)/100 }
/* whole dollars unless there ARE cents — an agreement total and its invoice must read
   identically, or somebody rings up about eleven cents */
function money2(v){ const n=cents(v);
  return "$"+n.toLocaleString(undefined,{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2}) }
function taxAmount(){ return cents(subtotal()*taxRate()) }
/* What the customer signs against, and what every draw is calculated from. */
function total(){ return cents(subtotal()+taxAmount()) }

function cloudToSurvey(v){ return {date:v.date||String(v.at||"").slice(0,10), job:v.site||"", w:Number(v.w), h:Number(v.h), wMin:Number(v.w_min??v.w), wMax:Number(v.w_max??v.w), hMin:Number(v.h_min??v.h), hMax:Number(v.h_max??v.h), nW:Number(v.n_w||0), nH:Number(v.n_h||0), clearances:v.clearances||null, by:v.by_name||"", cloud_id:v.id}; }

  box.innerHTML=`<div style="background:#fff;border-radius:4px;padding:18px;max-width:620px;width:100%"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font:12px var(--sans);color:var(--soft)"><span>${esc(v.site||"")}${v.opening?" · "+esc(v.opening):""} · ${esc(v.date||"")} · ${esc(v.by_name||"")}</span><button class="ghost" style="padding:6px 10px" onclick="document.getElementById('svBox').remove()">✕</button></div>${surveySvg(v,{dark:false})}</div>`; };
/* surveySvg(v) — one drawing of a laser survey. Used by laser.html, desk.html (Surveys), agree.html (picker).
   v = a surveys row (w, h, w_min.., raw{widthReadings[{pos,total}], heightReadings[..], clearances{top,left,right}}) */
function surveySvg(v, opt){
  opt=opt||{}; const W=Number(v.w)||0, H=Number(v.h)||0; if(!W||!H) return '<div style="padding:20px;color:#8f8a82">no opening</div>';
  const raw=v.raw||{}; const wr=(raw.widthReadings||[]).map(x=>({pos:String(x.pos||""),t:Number(x.total)||0})).filter(x=>x.t>0);
  const hr=(raw.heightReadings||[]).map(x=>({pos:String(x.pos||""),t:Number(x.total)||0})).filter(x=>x.t>0);
  const wmin=Number(v.w_min??(wr.length?Math.min(...wr.map(x=>x.t)):W)), wmax=Number(v.w_max??(wr.length?Math.max(...wr.map(x=>x.t)):W));
  const hmin=Number(v.h_min??(hr.length?Math.min(...hr.map(x=>x.t)):H)), hmax=Number(v.h_max??(hr.length?Math.max(...hr.map(x=>x.t)):H));
  const cl=v.clearances||raw.clearances||{}; const ct=Number(cl.top||0), cL=Number(cl.left||0), cR=Number(cl.right||0);
  const fi=n=>{ n=Number(n)||0; const ft=Math.floor(n/12), r=n-ft*12; const fr=Math.round(r*16)/16; const wh=Math.floor(fr), f=fr-wh; const F={0:"",0.0625:"1/16",0.125:"1/8",0.1875:"3/16",0.25:"1/4",0.3125:"5/16",0.375:"3/8",0.4375:"7/16",0.5:"1/2",0.5625:"9/16",0.625:"5/8",0.6875:"11/16",0.75:"3/4",0.8125:"13/16",0.875:"7/8",0.9375:"15/16"}[Math.round(f*10000)/10000]||""; return (ft?ft+"′ ":"")+(wh||!F?wh:"")+(F?(wh?"-":"")+F:"")+"″"; };
  const dark=opt.dark!==false; const ink=dark?"#f4f2ee":"#1c1a20", mute=dark?"#8f8a82":"#6b6558", bronze="#c9ab7f", line=dark?"#3a3a3a":"#cfc8ba", bg=dark?"#141414":"#fbf9f6", warn="#d9a441";
  const inner=dark?"#1f1f1f":"#fff";
  const pw=560, ph=Math.round(pw*Math.min(1.15,Math.max(0.45,H/W))+110); const pad=78; const iw=pw-pad*2, ih=ph-pad-60; const sx=iw/wmax, sy=ih/hmax;
  const cx=pad+iw/2, top=48;
  // true opening (max readings) faint, governing (min) solid
  const gx=cx-(W*sx)/2, gy=top+(hmax-H)*sy;   // governing sits on the floor
  const tx=cx-(wmax*sx)/2;
  // A value sits in its own gap in its line, in a box no line can cross. The line says which reading it is
  // (bottom / mid / top, left / centre / right), so the box carries the number alone. Anything that cannot
  // be placed clear of another value drops to a row under the opening with its position spelled out.
  const FS=11, CHW=FS*0.62, BH=FS+7;
  const tw=t=>t.length*CHW+10;
  const box=(x,y,t,col,rot)=>{ const w=tw(t), g=rot?` transform="rotate(-90 ${x.toFixed(1)} ${y.toFixed(1)})"`:"";
    return `<g${g}><rect x="${(x-w/2).toFixed(1)}" y="${(y-BH/2).toFixed(1)}" width="${w.toFixed(1)}" height="${BH}" rx="2" fill="${inner}" stroke="${col}" stroke-opacity=".45"/>`
         + `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${FS}" fill="${col}">${t}</text></g>`; };
  const seg=(x1,y1,x2,y2,col,w)=>(Math.abs(x2-x1)+Math.abs(y2-y1)>3?`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${w}"/>`:"");
  let s=`<svg viewBox="0 0 ${pw} ${ph}" width="100%" style="max-width:${pw}px;display:block;background:${bg};border-radius:4px;font-family:JetBrains Mono,ui-monospace,Menlo,monospace">`;
  s+=`<rect x="${tx}" y="${top}" width="${wmax*sx}" height="${hmax*sy}" fill="none" stroke="${line}" stroke-dasharray="5 4"/>`;
  s+=`<rect x="${gx}" y="${gy}" width="${W*sx}" height="${H*sy}" fill="${inner}" stroke="${bronze}" stroke-width="2"/>`;
  if(ct||cL||cR){ s+=`<rect x="${gx+cL*sx}" y="${gy+ct*sy}" width="${(W-cL-cR)*sx}" height="${(H-ct)*sy}" fill="none" stroke="${warn}" stroke-width="1" stroke-dasharray="3 3"/>`; }
  const placed=[], out=[];
  const clash=(a,b)=>!(a.x2<=b.x1||b.x2<=a.x1||a.y2<=b.y1||b.y2<=a.y1);
  const fits=(x,y,w,h)=>{ const r={x1:x-w/2-3,y1:y-h/2-3,x2:x+w/2+3,y2:y+h/2+3};
    if(r.x1<gx+2||r.x2>gx+W*sx-2||r.y1<gy+2||r.y2>gy+H*sy-2) return null;
    return placed.some(p=>clash(r,p))?null:r; };
  let ln="", lb="";
  // width readings across (bottom / mid / top)
  const rowY={Bottom:gy+H*sy-15,Mid:gy+H*sy/2,Top:gy+15};
  for(const r of wr){
    const y=rowY[r.pos]??gy+H*sy/2, gov=Math.abs(r.t-wmin)<1e-6, col=gov?bronze:mute, lw=gov?1.5:0.8;
    const t=`${fi(r.t)}${gov?" \u25c2":""}`, w=tw(t), hit=fits(cx,y,w,BH);
    if(hit){ placed.push(hit); ln+=seg(gx+6,y,cx-w/2-5,y,col,lw)+seg(cx+w/2+5,y,gx+W*sx-6,y,col,lw); lb+=box(cx,y,t,col,false); }
    else { ln+=seg(gx+6,y,gx+W*sx-6,y,col,lw); out.push({t:`${r.pos.toLowerCase()} ${t}`,col}); }
  }
  // height readings down (left / centre / right)
  const colX={Left:gx+15,Centre:cx,Center:cx,Right:gx+W*sx-15};
  for(const r of hr){
    const x=colX[r.pos]??cx, my=gy+H*sy/2, gov=Math.abs(r.t-hmin)<1e-6, col=gov?bronze:mute, lw=gov?1.5:0.8;
    const t=`${fi(r.t)}${gov?" \u25c2":""}`, w=tw(t), hit=fits(x,my,BH,w);
    if(hit){ placed.push(hit); ln+=seg(x,gy+6,x,my-w/2-5,col,lw)+seg(x,my+w/2+5,x,gy+H*sy-6,col,lw); lb+=box(x,my,t,col,true); }
    else { ln+=seg(x,gy+6,x,gy+H*sy-6,col,lw); out.push({t:`${r.pos.toLowerCase()} ${t}`,col}); }
  }
  s+=ln+lb;
  // whatever would not sit clear goes under the opening, spelled out
  if(out.length){ const gap=10, tot=out.reduce((a,o)=>a+tw(o.t),0)+gap*(out.length-1);
    let x=cx-tot/2, y=gy+H*sy+15;
    for(const o of out){ const w=tw(o.t); s+=box(x+w/2,y,o.t,o.col,false); x+=w+gap; } }
  // dimensions
  s+=`<text x="${cx}" y="${top-16}" text-anchor="middle" font-size="13" fill="${ink}" font-weight="600">${fi(W)} × ${fi(H)}</text>`;
  s+=`<text x="${cx}" y="${top-2}" text-anchor="middle" font-size="10" fill="${mute}">governing · smallest reading each way</text>`;
  const spW=wmax-wmin, spH=hmax-hmin; const sq=Math.max(spW,spH); const call=sq<0.125?"square within an eighth":sq<0.375?"slightly out of square":sq<0.75?"out of square":"well out of square";
  s+=`<text x="${cx}" y="${ph-34}" text-anchor="middle" font-size="11" fill="${sq>=0.375?warn:mute}">${call} · width varies ${spW.toFixed(3)}″ · height ${spH.toFixed(3)}″</text>`;
  if(ct||cL||cR) s+=`<text x="${cx}" y="${ph-18}" text-anchor="middle" font-size="10" fill="${warn}">clearance top ${fi(ct)} · left ${fi(cL)} · right ${fi(cR)} → door ${fi(W-cL-cR)} × ${fi(H-ct)}</text>`;
  else s+=`<text x="${cx}" y="${ph-18}" text-anchor="middle" font-size="10" fill="${mute}">${(v.site||"")+(v.opening?" · "+v.opening:"")+(v.date?" · "+v.date:"")+(v.by_name?" · "+v.by_name:"")}</text>`;
  return s+`</svg>`;
}

window.attachCloudSurvey=function(){ const pick=$("laserPick"), sel=$("laserTo"), msg=$("laserMsg"); const v=SURVEYS.find(x=>x.id===pick.value); if(!v){ msg.textContent="Pick a survey."; return; }
  const o=D.openings[+sel.value||0]; if(!o){ msg.textContent="No such opening."; return; } o.survey=cloudToSurvey(v); o.w=String(Math.round(o.survey.w*1000)/1000); o.h=String(Math.round(o.survey.h*1000)/1000); if((!o.nm||/^Opening \d+$/.test(o.nm))&&v.opening) o.nm=v.opening; render(); };
async function fileSurvey(sv,o){ try{ const j=await deskCall({action:"survey_add",survey:{date:sv.date,site:sv.job||(D.site||""),opening:o.nm||"",w:sv.w,h:sv.h,wMin:sv.wMin,wMax:sv.wMax,hMin:sv.hMin,hMax:sv.hMax,nW:sv.nW,nH:sv.nH,clearances:sv.clearances,by:sv.by||"",source:"agreement",raw:sv.raw||null},quote_id:(D._db&&D._db.quote_id)||null,customer_id:(D._db&&D._db.customer_id)||null}); if(j&&j.ok){ sv.cloud_id=j.id; loadSurveys(false); } }catch(e){} }
function attachSurvey(i,txt,msgEl){
  const r=readLaser(txt);
  const say=t=>{ if(msgEl)msgEl.textContent=t; else if(r.err)alert(t) };
  if(r.err){ say(r.err); return false }
  const o=D.openings[i]; if(!o){ say("No such opening."); return false }
  try{ r.survey.raw=JSON.parse(txt); }catch(e){}
  o.survey=r.survey; fileSurvey(r.survey,o);
  /* The survey overwrites the tape figures, because that is the entire point.
     What it must NOT do is overwrite the door count or the way it folds —
     those are decisions, not measurements, and the laser knows nothing about
     them. */
  o.w=String(Math.round(r.survey.w*1000)/1000);
  o.h=String(Math.round(r.survey.h*1000)/1000);
  if(!o.nm||/^Opening \d+$/.test(o.nm)){ if(r.survey.job)o.nm=r.survey.job }

}
window.importLaser=function(i,e){

    if(!j.ok){ dbSay(j.error); return }
    box.innerHTML=j.rows.map(r=>'<button style="font:inherit;font-size:12px;border:0;border-radius:5px;padding:6px 10px;cursor:pointer;background:#4a3564;color:#fff" onclick="dbPick(\''+r.id+'\',\''+String(r.name).replace(/'/g,"\\'")+'\','+(r.customer_no??'null')+')">'+(r.customer_no?('C-'+r.customer_no+' '):'')+r.name+' &middot; '+r.status+'</button>').join("");
    dbSay(j.rows.length?"pick the customer":"no match — enter them in Point of Contact first");
  },300);
}
async function dbPick(id,name,cno){
  dbSay("loading quotes…");
  const j=await dbCall({action:"cust_quotes",customer_id:id});
  if(!j.ok){ dbSay(j.error); return }
  let q=j.rows&&j.rows[0];
  if(!q){
    dbSay("no quote yet — opening one…");
    const nq=await dbCall({action:"quote",customer_id:id,by:"agreement"});
    if(!nq.ok){ dbSay(nq.error); return }
    q={id:nq.quote.id,quote_no:nq.quote.quote_no,status:nq.quote.status,value:null};
  }
  const c=j.customer||{};
  /* Pull into the document. The demo clears because a real buyer lands. */
  D.buyer=name; D.no=String(q.quote_no);
  if(c.email)D.email=c.email; if(c.phone)D.phone=c.phone;
  if(c.site_address)D.site=c.site_address;
  if(q.value&&!num(D.price))D.price=String(q.value);
  D._db={quote_id:q.id,quote_no:q.quote_no,customer_no:cno,customer_id:id,status:q.status};
  /* Estimator breakout: the quote already knows the openings — pull, don't retype. */
  const bo=q.breakout;
  if(bo&&bo.openings&&bo.openings.length&&confirm("Quote "+q.quote_no+" carries an Estimator breakout — pull its openings and line items in?")){
    D.openings=bo.openings.map((o,ix)=>{
      const cc=CONFIGS.find(x=>x.id===o.config);
      return {nm:o.label||("Opening "+(ix+1)), w:String(o.W||""), h:String(o.H||""),
        leaves:String(o.doors||(cc?cc.doors:4)), config:o.config||"2L2R",
        move:cc?cc.label.replace(/^\d+ doors — /,""):""};
    });
    let skipped=0;
    (bo.lines||[]).forEach(L=>{
      if(L.unit_price==null){skipped++;return;}
      (D.upcharges=D.upcharges||[]).push({desc:L.name+(L.qty>1?" ×"+L.qty:""),amt:String(L.total??Math.round(L.unit_price*(L.qty||1)))});
    });
    if(bo.weeks)D.weeks=String(bo.weeks);
    if(bo.rush){D.rush=true;D.rushWeeks=String(bo.rush.weeks||"");D.rushCost=String(bo.rush.upcharge||"");D.rushBy=bo.rush.approved_by||"";}
    const hd=(bo.openings||[]).filter(o=>/heavy duty/i.test(o.construction||""));
    const notes=[];
    if(hd.length)notes.push("Heavy Duty Steel construction ("+hd.map(o=>o.label).join(", ")+")"+(bo.hd_reviewed_by?" — reviewed by "+bo.hd_reviewed_by:""));
    if((bo.openings||[]).some(o=>/owner/i.test(o.cladding||"")))notes.push("Prepped for owner cladding — finish by others on the clad face.");
    if(notes.length)D.notes=(D.notes?D.notes+"\n":"")+notes.join("\n");
    if(bo.trim&&bo.trim.pct)D.notes=(D.notes?D.notes+"\n":"")+"Estimator trim level: "+bo.trim.name;
    if(skipped)alert(skipped+" line(s) had no price in the Estimator — cost them before this becomes a contract.");
  }
  document.getElementById("dbPanel").style.display="none";
  dbStamp(); render();
  dbSay("");
}
const SIGN_BASE="https://verify.bifolded.com/beta/sign.html"; /* MOUNTED — live e-sign links */
async function dbPublish(){
  if(!D._db){ alert("Link a customer first — Load from database."); return }
  const m=missing();
  if(m.length){ alert("Not ready to publish — still needed:\n\n· "+m.slice(0,8).join("\n· ")+(m.length>8?"\n· …":"")); return }
  renderDoc(); const html=(document.getElementById("doc")||{}).innerHTML||"";
  if(!html){ alert("Could not render the document — open 'Read it as they will see it' once, then publish."); return }
  const j=await dbCall({action:"agree_publish",quote_id:D._db.quote_id,doc:{html,data:D},by:D.rep||"office"});
  if(!j.ok){ alert("Not published: "+j.error); return }
  D._db.status="sent"; dbStamp();
  // 1.9 (0084): the signer's account is minted with the publish. Password shows ONCE — read it to them or text it.
  const link=SIGN_BASE+"?t="+j.token; let msg="Published — quote "+j.quote_no+".\n\nSigning link:\n"+link;
  if(j.login&&j.login.password) msg+="\n\nSIGN-IN (give this to the customer once):\ne-mail  "+j.login.email+"\npassword  "+j.login.password+"\nportal  https://verify.bifolded.com/beta/portal.html";
  else if(j.login) msg+="\n\nSigns in as "+j.login.email+" (existing account — Publish with 'reset password' if they lost it)";
  if(j.account_error) msg+="\n\n⚑ NO ACCOUNT: "+j.account_error;
  prompt(msg, link);
}
async function dbPublishReset(){ if(!D._db){ alert("Link a customer first."); return } if(!confirm("Mint a NEW password for this customer's account and republish?")) return;
  renderDoc(); const html=(document.getElementById("doc")||{}).innerHTML||""; const j=await dbCall({action:"agree_publish",quote_id:D._db.quote_id,doc:{html,data:D},by:D.rep||"office",reset_password:true}); if(!j.ok){ alert("Not published: "+j.error); return }
  prompt("New sign-in for "+(j.login&&j.login.email)+" (shown once):", (j.login&&j.login.password)||""); }
window.dbPublishReset=dbPublishReset;
async function dbSent(){
  if(!D._db){ alert("Link a customer first — Load from database."); return }
  const j=await dbCall({action:"agree_status",quote_id:D._db.quote_id,status:"sent",value:total()||null,
    ship_state:String(D.shipState||"CA").toUpperCase(),delivery_miles:num(D.deliveryMiles)||null,
    rush:!!D.rush,rush_by:D.rushBy||null,rush_weeks:num(D.rushWeeks)||null,rush_approved_by:D.rushSignTR||null,by:D.rep||"office"});
  if(!j.ok){ alert("Not recorded: "+j.error); return }
  D._db.status="sent"; dbStamp();
  alert("Quote "+D._db.quote_no+" marked SENT.");
}
async function dbAccepted(){
  if(!D._db){ alert("Link a customer first — Load from database."); return }
  if(!confirm("Customer signed? Closes quote "+D._db.quote_no+" — job born. Not a test."))return;
  const j=await dbCall({action:"agree_status",quote_id:D._db.quote_id,status:"accepted",value:total()||null,
    ship_state:String(D.shipState||"CA").toUpperCase(),delivery_miles:num(D.deliveryMiles)||null,
    rush:!!D.rush,rush_by:D.rushBy||null,rush_weeks:num(D.rushWeeks)||null,rush_approved_by:D.rushSignTR||null,by:D.rep||"office"});
  if(!j.ok){ alert("Not closed: "+j.error); return }
  D._db.status="accepted"; dbStamp();
  alert("Job "+D._db.quote_no+" born.");
}
/* keep the stamp fresh on load-from-file too */
(function(){ const old=window.loadJSON; window.loadJSON=function(e){ old(e); setTimeout(dbStamp,300); }; dbStamp(); })();
document.body.style.paddingBottom="70px";

/* ---- MASTER CATALOG: the option lists live in the database now ----
   On load, the spec chips, cladding lists and track ratings are replaced
   by the catalog (active rows only). Off in the catalog = gone here.
   If the database is unreachable, the baked-in lists carry on — an
   agreement must still open from a job folder in ten years. */
async function dbCatalog(){
  const j=await dbCall({action:"catalog"});
  if(!j.ok||!j.options){ return }
  const act=j.options.filter(o=>o.active);
  const mk=o=>Object.assign({id:o.opt_id,n:o.name},o.blurb?{c:o.blurb}:{},o.data||{});
  Object.keys(OPT).forEach(k=>{
    const rows=act.filter(o=>o.group_key===k);
    if(rows.length)OPT[k].list=rows.map(mk);
  });
  const swap=(arr,key)=>{const rows=act.filter(o=>o.group_key===key).map(mk);
    if(rows.length)arr.splice(0,arr.length,...rows);};
  swap(CLAD_MATERIAL,"clad_material"); swap(CLAD_PROFILE,"clad_profile"); swap(CLAD_MOUNT,"clad_mount");
  const ratings={}; act.filter(o=>o.group_key==="hw").forEach(o=>{ if(o.data&&o.data.rating!=null)ratings[o.opt_id]=Number(o.data.rating); });
  if(Object.keys(ratings).length){ Object.keys(HW_RATING).forEach(k=>delete HW_RATING[k]); Object.assign(HW_RATING,ratings); }
  const ap=j.options.filter(o=>o.group_key==="rushApprover"&&o.active).map(o=>o.name);
  if(ap.length)RUSH_APPROVERS=ap;
  const inv=j.options.filter(o=>o.group_key==="invite"&&o.active);
  if(inv.length)INVITE.splice(0,INVITE.length,...inv.map(o=>({k:o.opt_id,n:o.name,
    pct:Number((o.data||{}).pct)||0,lede:(o.data||{}).lede||o.blurb||"",
    body:(o.data||{}).body||"",close:(o.data||{}).close||"",rec:(o.data||{}).rec})));
  window.__catalog=j; render();
}
dbCatalog();
async function dbConfigs(){
  const j=await dbCall({action:"configs"});
  if(!j.ok||!j.rows||!j.rows.length) return; // baked list carries on
  CONFIGS=j.rows.filter(r=>r.active).map(r=>({id:r.config_id,doors:r.doors,label:r.label,gaps:r.gaps,hardware:r.hardware}));
  render();
}
dbConfigs();
