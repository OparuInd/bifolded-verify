<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TR Laser Measure</title>
<!--
  TR FINAL SOLUTION — measure.html (2026-08-16)  ·  CREW TOOL (worker token)
  The bifolded laser measurement app, absorbed into the system. Phone-
  first: pick the job, shoot the legs (3 widths T/M/B, 3 heights L/C/R,
  more if you want), the calc happens LIVE — smallest governs, max
  build shown before you leave the site. Out-of-square flagged over
  3/8". Submits into measurements: the Concept Desk chip, one-click
  Adopt and the sign-off laser gate all read these exact rows.
  Replaces measure.bifolded.com. Backend: tr-intake v3.5.
-->
<style>
  :root{ --purple:#3d2a56; --gold:#9C7A3E; --ink:#1c1a20; --line:#d9d4e0; --bg:#f7f5fa; --muted:#8a8194; --warn:#a01212; --ok:#1d7a46; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  header{background:var(--purple);color:#fff;padding:16px 18px;text-align:center}
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.04em}
  header .sub{opacity:.8;font-size:12.5px;margin-top:3px}
  main{max-width:560px;margin:14px auto 80px;padding:0 12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  h2{color:var(--purple);font-size:15px;margin:0 0 10px}
  label.top{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--purple);font-weight:700;margin:10px 0 4px}
  select,input{width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:17px;background:#fff}
  .legs{display:flex;gap:8px}
  .legs input{text-align:center;font-size:18px;font-weight:700}
  .leglbl{display:flex;gap:8px;margin-top:3px}
  .leglbl span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;padding:14px 16px;font-size:16px;width:100%}
  button.go{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:700}
  button.small{width:auto;padding:8px 12px;font-size:13px}
  .calc{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.5}
  .calc.ok{background:#e7f3ec;border:1.5px solid #bcdcc8}
  .calc.warn{background:#fbf7ec;border:1.5px solid #e6d9b8}
  .calc b{font-size:19px}
  .sq{color:#9a5b16;font-weight:700;font-size:13.5px}
  #msg{color:var(--warn);font-size:14px;min-height:18px;margin-top:8px}
  .done{background:#e7f3ec;border:2px solid var(--ok);border-radius:12px;padding:16px;font-size:16px}
  .done b{color:var(--ok)}
  .havechip{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;background:#e7f3ec;color:var(--ok);margin-left:6px}
  footer{text-align:center;font-size:11px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<header><h1>LASER MEASURE</h1><div class="sub" id="who">Loading…</div></header>
<main>
  <div class="card" id="form">
    <label class="top">Job</label>
    <select id="f_job"></select>
    <label class="top">Opening</label>
    <input id="f_open" value="Opening 1" placeholder="Opening 1">
    <label class="top">Widths — inches, decimals OK (244.0625)</label>
    <div class="legs"><input id="w1" type="number" step="0.0625" inputmode="decimal"><input id="w2" type="number" step="0.0625" inputmode="decimal"><input id="w3" type="number" step="0.0625" inputmode="decimal"></div>
    <div class="leglbl"><span>Top</span><span>Middle</span><span>Bottom</span></div>
    <label class="top">Heights</label>
    <div class="legs"><input id="h1" type="number" step="0.0625" inputmode="decimal"><input id="h2" type="number" step="0.0625" inputmode="decimal"><input id="h3" type="number" step="0.0625" inputmode="decimal"></div>
    <div class="leglbl"><span>Left</span><span>Center</span><span>Right</span></div>
    <div id="calc"></div>
    <label class="top">Measured by</label>
    <input id="f_by" placeholder="your name">
    <div style="margin-top:14px"><button class="go" onclick="submitM()">Save the lasers</button></div>
    <div id="msg"></div>
  </div>
  <div id="donebox" style="display:none" class="done"></div>
  <footer>Every leg is kept · the smallest governs · Tungsten Royce</footer>
</main>
<script>
const ENDPOINT="https://cwpvlcajnzxidgtrcpoa.supabase.co/functions/v1/tr-intake";
const APIKEY="sb_publishable_rfo4gZSOvpieHeb1I8aong_Jeha4eqN";
const TOKEN=new URLSearchParams(location.search).get("t")||"";
const call=async(b)=>{try{const r=await fetch(ENDPOINT,{method:"POST",headers:{"content-type":"application/json","Authorization":"Bearer "+APIKEY},body:JSON.stringify(Object.assign({token:TOKEN},b))});return await r.json();}catch(e){return{ok:false,error:"You look offline — try again."};}};
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt=(x)=>{const w=Math.floor(x);let n=Math.round((x-w)*32),d=32;if(n===32)return String(w+1)+'"';while(n&&n%2===0){n/=2;d/=2;}return n?w+"-"+n+"/"+d+'"':w+'"';};
function legs(p){return [1,2,3].map(i=>+$(p+i).value).filter(v=>v>1);}
function calc(){
  const w=legs("w"),h=legs("h"),el=$("calc");
  if(w.length<2||h.length<2){el.innerHTML="";return;}
  const mw=Math.min(...w),mh=Math.min(...h);
  const sw=Math.max(...w)-mw,sh=Math.max(...h)-mh;
  const oos=sw>0.375||sh>0.375;
  el.innerHTML='<div class="calc '+(oos?"warn":"ok")+'">Opening max <b>'+fmt(mw)+" × "+fmt(mh)+"</b><br>"+
    'Verified build (½" shims): <b>'+fmt(mw-1)+" × "+fmt(mh-0.5)+"</b>"+
    (oos?'<div class="sq">⚠ Out of square/plumb — legs spread '+fmt(Math.max(sw,sh))+". Note the site condition.</div>":"")+"</div>";
}
for(const id of["w1","w2","w3","h1","h2","h3"])$(id).addEventListener("input",calc);
async function load(){
  const r=await call({action:"measure_jobs"});
  if(!r.ok){$("who").textContent="";$("msg").textContent=r.error;return;}
  $("who").textContent=r.me+" — pick the job, shoot the legs";
  $("f_by").value=r.me;
  $("f_job").innerHTML=r.jobs.map(j=>{
    const ops=Object.keys(j.openings||{});
    return '<option value="'+j.id+'">'+esc(j.job_no)+(ops.length?" ✓ measured":"")+"</option>";}).join("");
}
async function submitM(){
  const r=await call({action:"measure_submit",job_id:$("f_job").value,opening:$("f_open").value.trim(),
    wLegs:legs("w"),hLegs:legs("h"),by:$("f_by").value.trim()});
  if(!r.ok){$("msg").textContent=r.error;return;}
  $("form").style.display="none";
  const oos=r.spread_w>0.375||r.spread_h>0.375;
  $("donebox").style.display="block";
  $("donebox").innerHTML="<b>Saved ✓</b> "+esc(r.job_no)+" · "+esc(r.opening)+"<br>Opening max <b>"+fmt(r.max_w)+" × "+fmt(r.max_h)+"</b> — signed "+esc(r.by)+"."+
    (oos?'<div class="sq" style="margin-top:6px">⚠ Flagged out of square — the office sees it.</div>':"")+
    '<div style="margin-top:12px"><button class="go" onclick="again()">Measure another opening</button></div>';
}
function again(){$("form").style.display="block";$("donebox").style.display="none";
  for(const id of["w1","w2","w3","h1","h2","h3"])$(id).value="";
  const m=$("f_open").value.match(/^(.*?)(\d+)\s*$/);
  if(m)$("f_open").value=m[1]+(Number(m[2])+1);
  $("calc").innerHTML="";load();}
if(!TOKEN){$("who").textContent="";$("msg").textContent="This link is missing its code — use your keyed link.";}
else load();
</script>
</body>
</html>
